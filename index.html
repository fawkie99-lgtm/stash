<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0d0d" id="themeColor">
<title>Stash</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='22' rx='6' fill='%23777'/%3E%3C/svg%3E">
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Roboto,"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif}

/* ---------- themes ---------- */
body[data-theme="crimson"]{
  color-scheme:dark;
  --bg:#1f1f1f;--bar:#0d0d0d;--panel:#262626;--panel2:#323232;--line:#383838;
  --text:#d9d9d9;--strong:#fff;--muted:#8c8c8c;
  --accent:#ed2553;--accent-2:#f15478;--on-accent:#fff;
  --btn:#4d4d4d;--btn-hover:#5e5e5e;--btn-text:#fff;
  --tag:#4d4d4d;--tag-hover:#5e5e5e;--tag-text:#fff;--tag-count:#333;--tag-count-text:#bdbdbd;
  --field:#1a1a1a;--search:#333;--search-text:#eee;
  --radius:4px;--card-radius:0px;--thumb-ratio:7/10;--card-min:200px;--gap:12px;
  --shadow:0 10px 40px rgba(0,0,0,.6);--toast:#3a3a3a;
}
body[data-theme="azure"]{
  color-scheme:light;
  --bg:#fff;--bar:#fff;--panel:#f5f5f5;--panel2:#ebebeb;--line:#e4e4e4;
  --text:#1f1f1f;--strong:#000;--muted:#858585;
  --accent:#0096fa;--accent-2:#0080d6;--on-accent:#fff;
  --btn:#f0f0f0;--btn-hover:#e2e2e2;--btn-text:#1f1f1f;
  --tag:#f0f0f0;--tag-hover:#e4e4e4;--tag-text:#0069b1;--tag-count:transparent;--tag-count-text:#858585;
  --field:#fff;--search:#f2f2f2;--search-text:#1f1f1f;
  --radius:8px;--card-radius:8px;--thumb-ratio:1/1;--card-min:184px;--gap:22px 16px;
  --shadow:0 10px 40px rgba(0,0,0,.16);--toast:#1f1f1f;
}
body[data-theme="midnight"]{
  color-scheme:dark;
  --bg:#161616;--bar:#1c1c1c;--panel:#232323;--panel2:#2e2e2e;--line:#333;
  --text:#e6e6e6;--strong:#fff;--muted:#8a8a8a;
  --accent:#0096fa;--accent-2:#36aaff;--on-accent:#fff;
  --btn:#2e2e2e;--btn-hover:#3a3a3a;--btn-text:#eee;
  --tag:#2a2a2a;--tag-hover:#353535;--tag-text:#5cb8ff;--tag-count:transparent;--tag-count-text:#8a8a8a;
  --field:#161616;--search:#2a2a2a;--search-text:#eee;
  --radius:8px;--card-radius:8px;--thumb-ratio:1/1;--card-min:184px;--gap:22px 16px;
  --shadow:0 10px 40px rgba(0,0,0,.6);--toast:#333;
}
body[data-theme="amoled"]{
  color-scheme:dark;
  --bg:#000;--bar:#000;--panel:#0b0b0b;--panel2:#161616;--line:#1f1f1f;
  --text:#e3e3e3;--strong:#fff;--muted:#8a8a8a;
  --accent:#ed2553;--accent-2:#f15478;--on-accent:#fff;
  --btn:#1a1a1a;--btn-hover:#262626;--btn-text:#eee;
  --tag:#141414;--tag-hover:#222;--tag-text:var(--accent);--tag-count:transparent;--tag-count-text:#8a8a8a;
  --field:#000;--search:#141414;--search-text:#eee;
  --radius:8px;--card-radius:6px;--thumb-ratio:7/10;--card-min:184px;--gap:14px 10px;
  --shadow:0 10px 40px rgba(0,0,0,.9);--toast:#1f1f1f;
  --cap-bg:rgba(0,0,0,.72);--cap-text:#e6e6e6;
}
body[data-theme="crimson"]{--cap-bg:rgba(64,64,64,.92);--cap-text:#d9d9d9}
body[data-theme="azure"]{--cap-bg:rgba(255,255,255,.92);--cap-text:#1f1f1f}
body[data-theme="midnight"]{--cap-bg:rgba(22,22,22,.88);--cap-text:#eee}
@media (max-width:600px){
  body[data-theme]{--card-min:140px}
  body[data-theme="amoled"]{--gap:10px 8px}
  body[data-theme="crimson"]{--gap:8px}
  body[data-theme="azure"],body[data-theme="midnight"]{--gap:16px 10px}
}
body.size-s{--card-min:150px}
body.size-l{--card-min:280px}
@media (max-width:600px){body.size-s{--card-min:100px}body.size-l{--card-min:220px}}
body.shape-tall{--thumb-ratio:7/10}
body.shape-square{--thumb-ratio:1/1}
body.shape-wide{--thumb-ratio:16/10}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);min-height:100vh;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
svg{flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.lnk{color:var(--accent);font-weight:600}
.lnk:hover{text-decoration:underline}

/* ---------- lock screen ---------- */
#lock{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px 16px}
body.locked #lock{display:flex}
body.locked .topbar,body.locked main,body.locked #bulk,body.locked .tabbar{display:none!important}
.lockbox{width:100%;max-width:360px;text-align:center}
.lockbox .logo{justify-content:center;margin:0 0 26px;font-size:30px}
.lockbox .logo svg{width:40px;height:40px}
.lockbox h2{color:var(--strong);font-size:20px;margin:0 0 8px}
.lockbox p{color:var(--muted);margin:0 0 20px}
.lockbox .input{height:48px;font-size:16px;margin-bottom:10px;text-align:center}
.lockbox .btn{width:100%;height:46px;font-size:15px;margin-top:4px}
.lockbox .err{color:#ff5a6e;font-weight:700;min-height:22px;margin-top:10px}
.lockbox .small{font-size:12px;color:var(--muted);margin-top:28px}
.lockbox .small button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:12px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--bar);border-bottom:1px solid var(--line)}
body[data-theme="crimson"] .topbar{border-bottom-color:transparent}
.bar{display:flex;align-items:center;gap:14px;height:58px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:23px;letter-spacing:-.6px;color:var(--strong);flex:none;min-width:0}
.logo span{text-transform:lowercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9em}
.logo svg{width:30px;height:30px;color:var(--accent)}
.logo .cut{fill:var(--bar)}
.lockbox .logo .cut{fill:var(--bg)}
.search{position:relative;flex:1;display:flex;max-width:560px;min-width:0}
.search input{flex:1;min-width:0;height:38px;border:0;padding:0 14px;background:var(--search);color:var(--search-text);border-radius:var(--radius) 0 0 var(--radius);outline:none;font-size:14px}
.search input::placeholder{color:#8a8a8a}
.search button{width:46px;height:38px;border:0;background:var(--accent);color:var(--on-accent);border-radius:0 var(--radius) var(--radius) 0;display:grid;place-items:center}
.search button svg{width:18px;height:18px}
body:not([data-theme="crimson"]) .search input{border-radius:999px 0 0 999px;padding-left:18px}
body:not([data-theme="crimson"]) .search button{border-radius:0 999px 999px 0}
.links{display:flex;align-items:center;gap:2px;margin-left:auto}
.links a{padding:8px 11px;border-radius:var(--radius);font-weight:700;white-space:nowrap;color:var(--text)}
.links a:hover{color:var(--strong);background:var(--panel)}
.links a.active{color:var(--accent)}
.actions{display:flex;align-items:center;gap:4px}
.upload-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border:0;border-radius:var(--radius);background:var(--accent);color:var(--on-accent);font-weight:700;white-space:nowrap;margin-right:4px}
body:not([data-theme="crimson"]) .upload-btn{border-radius:999px}
.upload-btn:hover{background:var(--accent-2)}
.upload-btn svg{width:18px;height:18px}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border:0;background:none;border-radius:var(--radius);color:var(--text)}
.icon-btn:hover{background:var(--panel)}
.icon-btn svg{width:20px;height:20px}
@media (max-width:1100px){
  .topbar{position:static}
  .bar{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:8px;row-gap:10px}
  .actions{margin-left:auto}
  .search{order:3;flex-basis:100%;max-width:none}
  .links{order:4;flex-basis:100%;margin:0 0 0 -10px;overflow-x:auto;scrollbar-width:none}
  .links::-webkit-scrollbar{display:none}
}
@media (max-width:420px){.upload-btn span{display:none}.upload-btn{padding:0 11px}}

/* ---------- page heads & controls ---------- */
main{padding:22px 0 100px}
.page-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;margin:2px 0 18px}
.page-head h1{font-size:22px;line-height:1.2;margin:0;color:var(--strong);font-weight:800;display:flex;align-items:center;gap:10px;min-width:0;word-break:break-word}
.page-head h1 .pre{color:var(--muted);font-weight:600}
.page-head h1 .count{font-size:12px;font-weight:700;color:var(--muted);background:var(--panel2);padding:3px 9px;border-radius:999px;flex:none}
.page-head .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl{height:34px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:var(--radius);padding:0 10px;min-width:0;outline:none}
.ctl:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border:0;border-radius:var(--radius);background:var(--btn);color:var(--btn-text);font-weight:700;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover:not(:disabled){background:var(--btn-hover)}
.btn svg{width:16px;height:16px}
.btn.primary,.btn.on{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled),.btn.on:hover:not(:disabled){background:var(--accent-2)}
.btn.danger{background:#c62a3c;color:#fff}
.btn.danger:hover:not(:disabled){background:#d93a4d}
.btn.ghost{background:transparent;color:var(--text)}
.btn.ghost:hover:not(:disabled){background:var(--panel)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
body:not([data-theme="crimson"]) .btn{border-radius:999px}
[data-act="fav"].on svg path,.fav.on svg path{fill:currentColor}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:3px;gap:3px}
.seg a,.seg button{border:0;background:none;padding:5px 12px;border-radius:calc(var(--radius) - 1px);font-weight:700;font-size:13px;color:var(--text)}
.seg a.on,.seg button.on{background:var(--accent);color:var(--on-accent)}
body:not([data-theme="crimson"]) .seg{border-radius:999px}
body:not([data-theme="crimson"]) .seg a,body:not([data-theme="crimson"]) .seg button{border-radius:999px}

/* ---------- grid & cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-min),1fr));gap:var(--gap)}
.card{position:relative;display:block;min-width:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.thumb{position:relative;aspect-ratio:var(--thumb-ratio);background:var(--panel2);border-radius:var(--card-radius);overflow:hidden}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s,filter .2s;-webkit-touch-callout:none}
.thumb img.ok{opacity:1}
body:not([data-theme="crimson"]) .card:hover .thumb img.ok{filter:brightness(.88)}
body.blur .thumb img.ok{filter:blur(18px) brightness(.9)}
body.blur .card:hover .thumb img.ok,body.blur .acard:hover .thumb img.ok{filter:none}
@media (hover:none){body.blur .card:hover .thumb img.ok,body.blur .acard:hover .thumb img.ok{filter:blur(18px) brightness(.9)}}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;color:var(--muted);font-weight:800;font-size:11px;letter-spacing:.05em}
.ph svg{width:34px;height:34px;opacity:.7}
.badge{position:absolute;top:6px;left:6px;z-index:1;display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.66);color:#fff;font-size:11px;font-weight:800;padding:2px 7px 2px 5px;border-radius:4px;line-height:16px}
.badge svg{width:11px;height:11px}
body:not([data-theme="crimson"]) .badge{border-radius:999px;top:7px;left:7px}
.fav{position:absolute;top:3px;right:3px;z-index:2;width:36px;height:36px;border:0;background:none;display:grid;place-items:center;color:#fff;opacity:0;transition:opacity .15s,transform .12s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.fav svg{width:23px;height:23px}
.fav:active{transform:scale(.85)}
.card:hover .fav,.fav.on{opacity:1}
.fav.on{color:#ff4060}
@media (hover:none){.fav{opacity:1}}
body:not([data-theme="crimson"]) .fav{top:auto;bottom:3px}
.check{display:none;position:absolute;top:6px;left:6px;z-index:2;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);box-shadow:0 1px 4px rgba(0,0,0,.5)}
body.selecting .check{display:block}
body.selecting .badge{left:38px}
.card.selected .check{background:var(--accent);border-color:var(--accent)}
.card.selected .check::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.card.selected .thumb{outline:3px solid var(--accent);outline-offset:-3px}
body.selecting .card .fav{display:none}

/* crimson: caption overlaid on the cover */
body[data-cards="overlay"] .card .caption{position:absolute;left:0;right:0;bottom:0;z-index:1;background:var(--cap-bg);color:var(--cap-text);font-weight:700;font-size:13px;line-height:16px;text-align:center;padding:4px 6px;max-height:40px;overflow:hidden;word-break:break-word;transition:max-height .25s}
body[data-cards="overlay"] .card:hover .caption{max-height:100%}
body[data-cards="overlay"] .card .sub{display:none}
/* azure / midnight: title under a rounded square */
body[data-cards="below"] .card .caption{margin-top:7px;font-weight:700;font-size:14px;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;display:flex;align-items:center;gap:4px}
.sub svg{width:12px;height:12px}

.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(140px,calc((100% - 48px) / 5));gap:12px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:thin}
.section{font-size:18px;font-weight:800;color:var(--strong);margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.section:first-child{margin-top:0}
.section a{margin-left:auto;font-size:13px}
body[data-theme="crimson"] .section{border-left:4px solid var(--accent);padding-left:10px}

/* ---------- pager ---------- */
.pager{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin:30px 0 6px}
.pager a,.pager span{min-width:38px;height:38px;padding:0 10px;display:grid;place-items:center;border-radius:var(--radius);background:var(--panel);color:var(--text);font-weight:700}
.pager a:hover{background:var(--panel2);color:var(--strong)}
.pager .cur{background:var(--accent);color:var(--on-accent)}
.pager .gap{background:none}
body:not([data-theme="crimson"]) .pager a,body:not([data-theme="crimson"]) .pager span{border-radius:999px}

/* ---------- tags ---------- */
.tag{display:inline-flex;align-items:stretch;border-radius:var(--radius);overflow:hidden;margin:0 5px 6px 0;font-size:13px;line-height:1;vertical-align:middle;background:var(--tag);max-width:100%}
.tag .n{padding:6px 8px;color:var(--tag-text);font-weight:600;display:inline-flex;align-items:center;gap:4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag .n svg{width:13px;height:13px}
.tag .ns{opacity:.6;font-weight:500;margin-right:-3px}
.tag .c{padding:6px 7px;background:var(--tag-count);color:var(--tag-count-text);font-size:12px;font-weight:700;display:inline-flex;align-items:center}
.tag:hover{background:var(--tag-hover)}
body[data-theme="crimson"] .tag:hover .n{background:#5e5e5e}
body:not([data-theme="crimson"]) .tag{border-radius:999px}
body:not([data-theme="crimson"]) .tag:not(.album) .n::before{content:"#";opacity:.75;margin-right:-2px}
body:not([data-theme="crimson"]) .tag .c{padding-left:0;padding-right:10px}
body:not([data-theme="crimson"]) .tag .n{padding-left:11px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 16px}
.tabs a{padding:6px 13px;border-radius:999px;background:var(--panel);font-weight:700;font-size:13px}
.tabs a:hover{background:var(--panel2)}
.tabs a.on{background:var(--accent);color:var(--on-accent)}
.letter{font-size:20px;font-weight:800;color:var(--strong);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.letter:first-child{margin-top:0}
.note{margin:-6px 0 16px;color:var(--muted)}

/* ---------- albums ---------- */
.acard{display:block;min-width:0;padding-top:10px}
.acard .thumb{margin-right:10px;box-shadow:5px -5px 0 -1px var(--panel2),10px -10px 0 -2px var(--line)}
.acard .aname{margin-top:8px;font-weight:800;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- detail ---------- */
.viewer{position:relative;background:#000;border-radius:var(--card-radius);display:flex;align-items:center;justify-content:center;min-height:260px;max-height:80vh;overflow:hidden}
.viewer img,.viewer video{display:block;max-width:100%;max-height:80vh;object-fit:contain}
.viewer img{cursor:zoom-in}
.viewer video{width:100%;height:auto}
.viewer.zoom{display:block;max-height:none;overflow:auto}
.viewer.zoom img{max-width:none;max-height:none;margin:0 auto;cursor:zoom-out}
.viewer .msg{color:#aaa;padding:48px 24px;text-align:center;max-width:460px}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:46px;height:70px;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;border-radius:6px;opacity:.65;transition:opacity .15s,background .15s}
.arrow:hover{opacity:1;background:rgba(0,0,0,.6)}
.arrow svg{width:26px;height:26px}
.arrow.prev{left:8px}.arrow.next{right:8px}
.viewer.zoom .arrow{position:fixed}
.info{background:var(--panel);border-radius:var(--radius);padding:20px 22px;margin-top:14px}
body:not([data-theme="crimson"]) .info{border-radius:12px}
.info h1{margin:0 0 4px;font-size:22px;line-height:1.25;color:var(--strong);word-break:break-word}
.info .orig{color:var(--muted);font-size:13px;margin-bottom:16px;word-break:break-all}
body[data-theme="crimson"] .info h1,body[data-theme="crimson"] .info .orig{text-align:center}
.rows{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:flex-start}
.row .lbl{flex:none;width:96px;color:var(--muted);font-weight:700;font-size:13px;padding-top:4px}
.row .val{flex:1;min-width:0;padding-top:3px}
.row .val:has(.tag){padding-top:0}
.actions-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
/* Favorite stays a calm button (the heart turns red); Delete sits apart, outlined, so the two can't be mixed up */
.btn.fav-btn.on,.btn.fav-btn.on:hover:not(:disabled){background:var(--btn);color:var(--btn-text)}
.btn.fav-btn.on svg{color:var(--accent)}
.danger-row{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.btn.danger-soft{background:transparent;color:#ff5a6e;border:1px solid rgba(255,90,110,.45)}
.btn.danger-soft:hover:not(:disabled){background:rgba(255,90,110,.12)}
body[data-theme="azure"] .btn.danger-soft{color:#c62a3c;border-color:rgba(198,42,60,.45)}
@media (max-width:600px){.info{padding:16px}.row .lbl{width:74px}.arrow{width:38px;height:56px}}

/* ---------- empty states ---------- */
.empty{text-align:center;padding:64px 20px;border:2px dashed var(--line);border-radius:14px;color:var(--muted)}
.empty h2{color:var(--strong);margin:10px 0 6px;font-size:20px}
.empty p{max-width:440px;margin:0 auto 18px}
.empty .big-ic svg{width:54px;height:54px;color:var(--accent)}

/* ---------- modals ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:7vh 12px 24px;overflow:auto;animation:fade .15s}

.input{width:100%;height:40px;border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:var(--radius);padding:0 11px;outline:none}

.hint{font-size:12px;color:var(--muted);margin-top:7px}

.ar-row{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}

.ft-wait{display:flex;align-items:center;gap:10px;color:var(--muted);padding:14px 0}

.ft-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}

.ft-chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:5px 11px;margin:0 6px 6px 0;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.ft-chip svg{width:14px;height:14px;flex:none}

.ft-more{margin:4px 0 10px}
.ft-more summary{cursor:pointer;font-weight:700;font-size:13px;padding:6px 0}
.ft-match{display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--text);text-decoration:none;font-size:13px}
.ft-match img,.ft-match .ph{width:44px;height:44px;object-fit:cover;border-radius:5px;background:var(--panel2);flex:none}
.ft-steps{margin:0 0 12px;padding-left:20px}

.check-row{display:flex;align-items:center;gap:9px;font-weight:600;margin:2px 0 12px;cursor:pointer}
.check-row input{width:18px;height:18px;accent-color:var(--accent);margin:0;flex:none}
.inline-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.inline-row .input{width:auto;height:36px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.summary{color:var(--muted);margin:-8px 0 16px}
.progress{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* chip input */
.chips{position:relative;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:42px;padding:6px 7px;border:1px solid var(--line);background:var(--field);border-radius:var(--radius);cursor:text}

.chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;background:var(--accent);color:var(--on-accent);border-radius:var(--radius);padding:3px 4px 3px 9px;font-size:13px;font-weight:700}

.chip button{border:0;background:rgba(255,255,255,.25);color:inherit;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;padding:0;font-size:13px;line-height:1;flex:none}

/* ---------- floating bits ---------- */

.more{height:2px}

.fcount{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;padding:0 5px}

.related{margin:-6px 0 18px}

.rank{position:absolute;top:0;left:0;z-index:2;min-width:32px;height:32px;padding:0 7px;display:grid;place-items:center;font-weight:800;font-size:15px;background:rgba(0,0,0,.72);color:#fff;border-bottom-right-radius:10px}

.avatar{position:relative;flex:none;width:96px;height:96px;border-radius:50%;overflow:hidden;background:var(--panel2);display:grid;place-items:center;color:var(--muted)}

.artist-hero{display:flex;gap:20px;align-items:center;background:var(--panel);border-radius:calc(var(--radius) + 6px);padding:20px;margin-bottom:22px}

.ah-main{min-width:0}

.stats{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);margin-bottom:10px}

@media (max-width:600px){.artist-hero{flex-direction:column;text-align:center;padding:18px 14px}.stats{justify-content:center}}

input[type="range"]{accent-color:var(--accent);flex:1;min-width:120px}

.lgrid,.grid.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:3px}

.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 64px),transparent);mask-image:linear-gradient(to right,transparent,#000 40px,#000 calc(100% - 64px),transparent)}

function setupLibEndless(sorted, per) {

const HOME_ROWS = [['cont', 'Continue watching'], ['reading', 'Continue reading'], ['foryou', 'For you'], ['favs', 'Favorites'], ['recent', 'Recently added'], ['week', 'Most viewed this week'], ['artist', 'A random artist'], ['doujinshi', 'Doujinshi'], ['videos', 'Videos'], ['photos', 'Photos']];

/* ---------- custom background ---------- */
function downscaleImage(blob, max) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob), img = new Image();
    img.onload = () => {
      const w = img.naturalWidth || 1, h = img.naturalHeight || 1, s = Math.min(1, max / Math.max(w, h));
      const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Couldn’t process that picture')), 'image/jpeg', 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('This browser can’t read that picture')); };
    img.src = url;
  });
}
function showBackground(blob) {
  if (S.bgUrl) URL.revokeObjectURL(S.bgUrl);
  S.bgUrl = blob ? URL.createObjectURL(blob) : null;
  $('#bgLayer .bg-img').style.backgroundImage = S.bgUrl ? `url("${S.bgUrl}")` : '';
  document.body.classList.toggle('has-bg', !!S.bgUrl);
}
async function setBackground(blob) {
  try {
    const img = await downscaleImage(blob, 2400);
    await dbPutKV('bg', { ...(await sealRec(await img.arrayBuffer())), type: 'image/jpeg' });
    showBackground(img);
    toast('Background set. Adjust dim and blur in Settings.', 3200);
    return true;
  } catch (e) { toast('Couldn’t set the background: ' + (e?.message || e)); return false; }
}
async function loadBackground() {
  try {
    const r = await dbGet('kv', 'bg');
    if (!r || !S.key) return showBackground(null);
    showBackground(new Blob([await unseal(S.key, r.iv, r.data)], { type: r.type || 'image/jpeg' }));
  } catch (e) { console.warn(e); }
}
async function removeBackground() {
  const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete('bg'); await txDone(t);
  showBackground(null);
}

async function loadReaderPage(el, token) {

  if (p.type === 'video') {

    return;
  }
  try {
    const rec = await dbGet('files', p.id); if (!rec || token !== renderToken) return;
    const blob = await decryptFile(rec, p.mime || ''); if (token !== renderToken) return;
    const url = URL.createObjectURL(blob); S.media.push(url);

}
async function makePost(ids, title) {
  const tops = ids.map(id => S.byId.get(id)).filter(Boolean);
  const pages = uniq(tops.flatMap(i => i.pages?.length > 1 ? i.pages : [i.id]));
  if (pages.length < 2) return null;
  const cover = S.byId.get(pages[0]), touched = new Set([cover]);
  for (const t of tops) if (t.pages && t.id !== cover.id) { delete t.pages; touched.add(t); }
  for (const pid of pages.slice(1)) { const pg = S.byId.get(pid); if (pg) { pg.parent = cover.id; touched.add(pg); } }
  delete cover.parent;
  cover.pages = pages;
  cover.tags = uniq(tops.flatMap(i => i.tags));
  cover.albums = uniq(tops.flatMap(i => i.albums));
  cover.fav = tops.some(i => i.fav);
  cover.views = tops.reduce((a, i) => a + (i.views || 0), 0);
  cover.added = Math.max(...tops.map(i => i.added || 0));
  if (title) cover.title = title;
  const sfw = tops.every(i => i.sfw === true);
  for (const m of touched) { if (sfw) m.sfw = true; else delete m.sfw; }
  for (const pid of pages) { const pg = S.byId.get(pid); if (pg) { if (sfw) pg.sfw = true; else delete pg.sfw; touched.add(pg); } }
  S.selected.clear();
  return (await saveMeta([...touched])) ? cover : null;
}
async function splitPost(post) {
  if (!await confirmDialog('Split this post?', `Its ${post.pages.length} pages become separate items again. Each one keeps the post’s tags and albums.`, 'Split post', false)) return;
  const pages = post.pages.map(id => S.byId.get(id)).filter(Boolean);
  for (const pg of pages) if (pg.id !== post.id) { delete pg.parent; if (post.sfw) pg.sfw = true; else delete pg.sfw; pg.tags = uniq([...pg.tags, ...post.tags]); pg.albums = uniq([...pg.albums, ...post.albums]); }
  delete post.pages;
  if (await saveMeta(pages, `Split into ${plural(pages.length, 'item')}`)) render({ keep: true });
}
async function putThumbRec(id, rec) { const t = db.transaction('thumbs', 'readwrite'); t.objectStore('thumbs').put(rec, id); await txDone(t); }

    await putThumbRec(post.id, rec);
    const old = S.thumbs.get(post.id); if (old) { URL.revokeObjectURL(old); S.thumbs.delete(post.id); }
    if (!post.hasThumb) { post.hasThumb = true; await dbPutMeta([post]); }

}
async function setThumbFromVideo(it, v) {

async function downloadItem(it) {

      where = await saveBlob(await decryptFile(rec, p.mime || ''), p.name || `${p.title || 'file'}.${ext(p).toLowerCase()}`);
      saved++;

// Hands a file to the browser's downloads, or inside the Android app writes it to Download/Stash.
// Resolves to where it was saved (app only).
async function saveBlob(blob, name, where = 'download') {
  if (NATIVE) {
    let m = null, bar = null;
    if (blob.size > 25e6) {
      m = modal(`<h3>${where === 'share' ? 'Getting it ready to share' : 'Saving'}</h3><p class="summary">${esc(name)}, ${fmtSize(blob.size)}</p><div class="progress"><i></i></div><div class="hint">Keep Stash open until this finishes.</div>`);
      m.ov.dataset.busy = '1'; bar = $('.progress i', m.el);

    finally { if (m) { delete m.ov.dataset.busy; m.close(); } }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 300000);
  return '';
}

/* ---------- Android app ---------- */
// Inside the Stash Android app the page gets a StashNative object for the things a web page can't do:
// saving files to Download, the real mini player, and removing originals from the gallery.
// In Chrome it doesn't exist and none of this runs.
const NCB = new Map(); let ncbSeq = 0;
window.__stashCb = (id, res) => { const f = NCB.get(id); if (f) { NCB.delete(id); f(res); } };
function nativeAsk(fn, ...args) {
  return new Promise(res => {
    const id = ++ncbSeq; NCB.set(id, res);
    try { NATIVE[fn](...args, id); } catch (e) { NCB.delete(id); res({ status: 'error' }); }
  });
}
const blobB64 = b => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => { const s = String(r.result); res(s.slice(s.indexOf(',') + 1)); };
  r.onerror = () => rej(r.error || new Error('Couldn’t read the file'));
  r.readAsDataURL(b);
});
// where: 'download' (Download/Stash), 'gallery' (Pictures/Stash or Movies/Stash) or 'share' (opens the share sheet).
async function nativeSave(blob, name, onProgress, dest = 'download') {
  const id = dest !== 'download' && NATIVE.saveBeginTo ? NATIVE.saveBeginTo(name, blob.type || '', dest) : NATIVE.saveBegin(name, blob.type || '');
  if (!id) throw new Error(dest === 'share' ? 'Couldn’t get the file ready to share' : 'Couldn’t create the file on the phone');
  const CH = 3 << 20; let ok = false, where = '';
  try {
    for (let off = 0; off < blob.size; off += CH) {
      if (!NATIVE.saveChunk(id, await blobB64(blob.slice(off, off + CH)))) throw new Error('Writing failed. Is the phone’s storage full?');
      onProgress?.(Math.min(1, (off + CH) / blob.size));
    }
    ok = true;
  } finally { where = NATIVE.saveEnd(id, ok); }
  return where;
}
async function offerRemoveOriginals(files) {
  const n = files.length;
  const ok = await confirmDialog('Remove the originals from your gallery?',
    `${n === 1 ? 'The file you just added is' : `The ${n} files you just added are`} safely in Stash. Android will ask you to confirm. Then they go to your phone’s trash, which deletes them for good after 30 days.`,
    'Remove from gallery', false);
  if (!ok) return;
  const r = await nativeAsk('removeOriginals', JSON.stringify(files.map(f => ({ name: f.name, size: f.size }))));
  const st = r?.status;
  if (st === 'ok') toast(r.found < r.asked ? `Moved ${r.found} of ${r.asked} to the phone’s trash. Delete the rest in your gallery.` : `Moved ${plural(r.found, 'original')} to the phone’s trash`, 4500);
  else if (st === 'cancelled') toast('Kept the originals');
  else if (st === 'denied') toast('Stash needs access to your photos and videos to find them. You can delete them in your gallery instead.', 5500);
  else if (st === 'none') toast('Couldn’t find them in your gallery. Delete them there yourself.', 4500);
  else if (st === 'unsupported') toast('This Android version can’t do that. Delete them in your gallery instead.', 4500);
  else toast('Couldn’t remove them. Delete them in your gallery instead.', 4500);
}
function bindNative() {

/* ================= find tags (reverse image search) ================= */
// Asks SauceNAO where a picture comes from (Pixiv, Danbooru, Gelbooru, nhentai and similar art sites)
// and turns the artist, characters and series it reports into tags. When the match is on Danbooru,
// that post's full tag list is offered too. Only a small copy of the one picture is sent.
const SAUCE_URL = 'https://saucenao.com/search.php';
const SAUCE_KEY_PAGE = 'https://saucenao.com/user.php?page=search-api';
const SAUCE_MIN = 60;   // closer matches than this are usually right
const SAUCE_AUTO = 80;  // bulk lookups only trust matches at least this close
const BOORU = /danbooru|gelbooru|yande|konachan|sankaku|e621/i;
const TAG_JUNK = /(username|watermark|signature|web address|artist name|^dated$|logo$|^commentary|request$)/;
const sleep = ms => new Promise(r => setTimeout(r, ms));

// A request that the Android app makes itself; in a browser it's a normal fetch, which most sites refuse.
async function webRequest(url, file) {
  if (NATIVE?.httpRequest) {
    const b64 = file ? await blobB64(file.blob) : '';
    const r = await nativeAsk('httpRequest', url, file?.field || '', file?.name || '', file?.blob?.type || '', b64);
    if (!r || !r.status) throw new Error('No connection. Check the internet and try again.');
    return { status: r.status, text: r.body || '' };
  }
  let res;
  try {
    if (file) { const fd = new FormData(); fd.append(file.field, file.blob, file.name); res = await fetch(url, { method: 'POST', body: fd }); }
    else res = await fetch(url, { headers: { Accept: 'application/json' } });
  } catch { throw new Error('The browser blocked the request. Finding tags works in the Stash Android app.'); }
  return { status: res.status, text: await res.text() };
}

// A JPEG of at most 1000 px to search with: the picture itself, a doujinshi's cover, or a video's thumbnail.
async function lookupImage(it) {
  const p = isPost(it) ? (S.byId.get(it.pages[0]) || it) : it;
  if (p.type === 'image') {
    const rec = await dbGet('files', p.id); if (!rec) throw new Error('The file is missing from storage');
    const url = URL.createObjectURL(await decryptFile(rec, p.mime || ''));
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Couldn’t open the picture')); i.src = url; });
      return await drawThumb(img, img.naturalWidth, img.naturalHeight, 1000, 0.9);
    } finally { URL.revokeObjectURL(url); }
  }
  const tu = await thumbURL(p.id);
  if (!tu) throw new Error('This video has no thumbnail to search with');
  return await (await fetch(tu)).blob();
}

// "(C97) [Circle (Artist)] Night City (Original) [English]" -> "Night City"
function cleanTitle(t) {
  const raw = String(t || '').trim(), O = '([{【', C = ')]}】';
  let s = raw;
  const cutHead = () => { if (!O.includes(s[0])) return false; let d = 0; for (let i = 0; i < s.length; i++) { if (O.includes(s[i])) d++; else if (C.includes(s[i]) && --d === 0) { s = s.slice(i + 1).trim(); return true; } } return false; };
  const cutTail = () => { if (!C.includes(s[s.length - 1])) return false; let d = 0; for (let i = s.length - 1; i >= 0; i--) { if (C.includes(s[i])) d++; else if (O.includes(s[i]) && --d === 0) { s = s.slice(0, i).trim(); return true; } } return false; };
  while (s && cutHead());
  while (s && cutTail());
  return s || raw;
}
function parseSauce(r) {
  const h = r?.header || {}, d = r?.data || {};
  const list = v => (Array.isArray(v) ? v : typeof v === 'string' ? v.split(/\s*,\s*|\n+/) : []).map(x => String(x).trim()).filter(x => x && !/^unknown$/i.test(x));
  const idx = String(h.index_name || '');
  let site = idx.replace(/^Index #\d+:\s*/, '').replace(/\s+-\s+.*$/, '').replace(/^H-Misc\s*\((.+)\)$/i, '$1').replace(/\s+Images$/i, '').trim();
  const urls = (Array.isArray(d.ext_urls) ? d.ext_urls : []).filter(u => /^https?:\/\//.test(u));
  if (!site && urls[0]) try { site = new URL(urls[0]).hostname.replace(/^www\./, ''); } catch {}
  const doujin = /nhentai|e-hentai|h-misc|mangadex|doujin/i.test(idx);
  return {
    sim: parseFloat(h.similarity) || 0, site: site || 'Unknown site', thumb: /^https:\/\//.test(h.thumbnail || '') ? h.thumbnail : '',
    url: urls[0] || (/^https?:\/\//.test(d.source || '') ? d.source : ''),
    artists: uniq([...list(d.creator), ...list(d.member_name), ...list(d.author_name), ...list(d.twitter_user_handle)]),
    characters: list(d.characters), series: list(d.material),
    title: doujin ? cleanTitle(d.eng_name || d.jp_name || d.source) : String(d.title || '').trim(),
    doujin, danbooru: d.danbooru_id || null,
  };
}

async function sauceSearch(blob) {
  const key = (S.settings.sauceKey || '').trim();
  const url = `${SAUCE_URL}?output_type=2&numres=8&db=999&api_key=${encodeURIComponent(key)}`;
  const r = await webRequest(url, { field: 'file', name: 'search.jpg', blob });
  let j = null; try { j = JSON.parse(r.text); } catch {}
  const msg = j?.header?.message ? String(j.header.message).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() : '';
  if (r.status === 429 || /rate|limit/i.test(msg) && (j?.header?.status ?? 0) < 0) {
    const day = /daily|24/i.test(msg);
    const e = new Error(day ? 'SauceNAO’s daily search limit is used up. It frees up again over the next 24 hours.' : 'Too many searches in a short time. Wait 30 seconds and try again.');
    e.limit = day ? 'day' : 'short'; throw e;
  }
  if (r.status === 403 || /api key|invalid key/i.test(msg)) { const e = new Error('SauceNAO didn’t accept the API key. Check it in Settings → Finding tags.'); e.badKey = true; throw e; }
  if (!j || r.status >= 400 || (j.header?.status ?? 0) < 0) throw new Error(msg || `SauceNAO had a problem (error ${r.status}). Try again later.`);
  return {
    results: (j.results || []).map(parseSauce).sort((a, b) => b.sim - a.sim),
    left: { short: Number(j.header?.short_remaining ?? NaN), long: Number(j.header?.long_remaining ?? NaN) },
  };
}

async function danbooruTags(id) {
  try {
    const r = await webRequest(`https://danbooru.donmai.us/posts/${encodeURIComponent(id)}.json?only=tag_string_artist,tag_string_character,tag_string_copyright,tag_string_general`);
    if (r.status !== 200) return null;
    const j = JSON.parse(r.text);
    const sp = s => String(s || '').split(' ').filter(Boolean).map(normTag).filter(Boolean);
    const out = { artists: sp(j.tag_string_artist), characters: sp(j.tag_string_character), series: sp(j.tag_string_copyright), general: sp(j.tag_string_general).filter(t => !TAG_JUNK.test(t)) };
    return out.artists.length + out.characters.length + out.series.length + out.general.length ? out : null;
  } catch { return null; }
}

// Turns the matches into tag suggestions. `on` marks the ones picked to start with.
function suggestFrom(results, dan, minSim = SAUCE_MIN) {
  const good = results.filter(r => r.sim >= minSim);
  const top = good[0]?.sim || 0;
  const use = good.filter(r => r.sim >= top - 12).sort((a, b) => (BOORU.test(b.site) - BOORU.test(a.site)) || b.sim - a.sim);
  const out = { artist: [], character: [], series: [], general: [], title: '', url: '', best: good[0] || null, use };
  const add = (ns, name, on) => {
    const v = normTag(String(name).replace(/[@＠].*$/, ''));
    if (!v || (ns === 'series' && v === 'original')) return;
    const tag = ns === 'general' ? v : `${ns}:${v}`;
    const have = out[ns].find(x => x.tag === tag);
    if (have) { have.on = have.on || on; return; }
    out[ns].push({ tag, label: v, on });
  };
  if (dan) {
    dan.artists.forEach(a => add('artist', a, true)); dan.characters.forEach(c => add('character', c, true));
    dan.series.forEach(s => add('series', s, true)); dan.general.forEach(g => add('general', g, false));
  }
  use.forEach((r, i) => {
    const first = !dan && i === 0;
    r.artists.forEach(a => add('artist', a, first));
    r.characters.forEach(c => add('character', c, first));
    r.series.forEach(s => add('series', s, first));
  });
  out.title = (use.find(r => r.doujin && r.title) || {}).title || '';
  out.url = (use.find(r => r.url && BOORU.test(r.site)) || use.find(r => r.url) || {}).url || '';
  return out;
}

async function ensureSauceKey() { return (S.settings.sauceKey || '').trim() || await askSauceKey(); }

const ftChip = (x, have) => `<button type="button" class="ft-chip${have ? ' have' : x.on ? ' on' : ''}" data-tag="${esc(x.tag)}"${have ? ' disabled' : ''}>${have || x.on ? I.check : ''}<span>${esc(x.label)}</span></button>`;
const pct = n => Math.round(n) + '%';

async function findTags(it) {
  if (!await ensureSauceKey()) return;
  let res, dan = null, qUrl = '';

async function bulkFind(items) {
  if (!await ensureSauceKey()) return;
  let todo = items.filter(i => !i.looked);
  if (!todo.length) {
    if (!await confirmDialog('Look them up again?', `All ${plural(items.length, 'item')} were looked up before.`, 'Look up again', false)) return;
    todo = items;
  }
  const already = items.length - todo.length;
  const m = modal(`<h3>Finding tags</h3>
    <p class="summary">Adds the artist, characters and series from close matches (${SAUCE_AUTO}% or more). To pick from all of a picture’s tags, open it and use Find tags.${already ? ` Skipping ${plural(already, 'item')} looked up before.` : ''}</p>
    <div class="progress"><i></i></div><div class="hint" id="bfTxt">Starting…</div>
    <div class="foot"><button class="btn" id="bfStop">Stop</button></div>`);
  m.ov.dataset.busy = '1';
  const bar = $('.progress i', m.el), txt = $('#bfTxt', m.el);
  let stop = false, tagged = 0, none = 0, failed = 0, done = 0, why = '';
  $('#bfStop', m.el).onclick = () => { stop = true; $('#bfStop', m.el).disabled = true; txt.textContent = 'Stopping…'; };
  const wait = async ms => { const end = Date.now() + ms; while (!stop && Date.now() < end) await sleep(250); };
  for (let k = 0; k < todo.length && !stop; k++) {
    const it = todo[k], t0 = Date.now();
    bar.style.width = (k / todo.length * 100) + '%';
    txt.textContent = `${k + 1} of ${todo.length}: ${it.title || it.name || 'Untitled'} · ${tagged} tagged so far`;
    let pause = 4000;
    try {
      const { results, left } = await sauceSearch(await lookupImage(it));
      const sg = suggestFrom(results, null, SAUCE_AUTO);
      const add = [...sg.artist, ...sg.character, ...sg.series].filter(x => x.on).map(x => x.tag).filter(t => !it.tags.includes(t));
      it.looked = Date.now();
      if (sg.best) { it.tags = uniq([...it.tags, ...add]); if (!it.src && sg.url) it.src = sg.url; if (add.length) tagged++; else none++; } else none++;
      await dbPutMeta([it]); done++;
      if (left.long <= 0) { why = 'SauceNAO’s daily limit is used up, so it stopped here. Run it again tomorrow and it continues with the rest.'; break; }
      if (left.short <= 0) pause = 31000;
    } catch (e) {
      if (e.limit === 'short') { txt.textContent = 'Waiting 30 seconds for SauceNAO…'; await wait(31000); k--; continue; }
      if (e.limit === 'day' || e.badKey || /connection|browser blocked/i.test(e.message)) { why = e.message; break; }
      failed++;
    }
    if (k < todo.length - 1) await wait(Math.max(0, pause - (Date.now() - t0)));
  }
  delete m.ov.dataset.busy; m.close(); changed();
  const parts = [`Tagged ${plural(tagged, 'item')}`];
  if (none) parts.push(`${none} had no close match`);
  if (failed) parts.push(`${failed} failed`);
  if (done || !why) toast(parts.join(', ') + (stop && done < todo.length && !why ? '. Stopped.' : '.'), 5000);
  if (why) toast(why, 7000);
  render({ keep: true });
}
/* ================= CBZ / ZIP import ================= */
// Turns comic archives into doujinshi posts: Kotatsu downloads (single CBZ, or a folder of chapter CBZs
// plus its index.json), CBZs with a ComicInfo.xml (Mihon, gallery-dl and others), or any ZIP of pictures.
// Pages are read straight out of the archive, so nothing has to be unpacked first.
const PAGE_RE = /\.(jpe?g|png|gif|webp|avif|bmp|jxl)$/i;
const KOTATSU_PAGE = /^(-?\d+)_(\d{4})(\d{4})$/;
const natural = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
const isArchive = f => /\.(cbz|zip)$/i.test(f.name) || /^application\/(zip|x-zip-compressed|x-cbz|vnd\.comicbook\+zip)$/.test(f.type || '');
const isOtherArchive = f => /\.(cbr|rar|cb7|7z|cbt|tar)$/i.test(f.name);
const baseOf = p => p.split('/').pop();
const stem = n => n.replace(/\.[^.]+$/, '');

// Reads a ZIP's table of contents (including ZIP64, for archives over 4 GB).
async function readZip(file) {
  const tailLen = Math.min(file.size, 65557 + 20);
  const tail = new DataView(await file.slice(file.size - tailLen).arrayBuffer());
  let eo = -1;
  for (let i = tail.byteLength - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { eo = i; break; }
  if (eo < 0) {
    const sig = new Uint8Array(await file.slice(0, 4).arrayBuffer());
    if (sig[0] === 0x52 && sig[1] === 0x61 && sig[2] === 0x72) throw new Error('It’s a RAR archive (CBR). Only ZIP-based CBZ files can be imported.');
    throw new Error('Not a CBZ/ZIP file, or it’s damaged');
  }
  let count = tail.getUint16(eo + 10, true), cdSize = tail.getUint32(eo + 12, true), cdOff = tail.getUint32(eo + 16, true);
  if (count === 0xffff || cdSize === 0xffffffff || cdOff === 0xffffffff) {
    const loc = eo - 20;
    if (loc < 0 || tail.getUint32(loc, true) !== 0x07064b50) throw new Error('This ZIP format isn’t supported');
    const at = Number(tail.getBigUint64(loc + 8, true));
    const z = new DataView(await file.slice(at, at + 56).arrayBuffer());
    if (z.getUint32(0, true) !== 0x06064b50) throw new Error('This ZIP format isn’t supported');
    count = Number(z.getBigUint64(32, true)); cdSize = Number(z.getBigUint64(40, true)); cdOff = Number(z.getBigUint64(48, true));
  }
  const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
  const dec = new TextDecoder('utf-8'), out = [];
  for (let p = 0, k = 0; k < count && p + 46 <= cd.byteLength; k++) {
    if (cd.getUint32(p, true) !== 0x02014b50) break;
    const flags = cd.getUint16(p + 8, true), method = cd.getUint16(p + 10, true);
    let csize = cd.getUint32(p + 20, true), usize = cd.getUint32(p + 24, true), lho = cd.getUint32(p + 42, true);
    const nlen = cd.getUint16(p + 28, true), xlen = cd.getUint16(p + 30, true), clen = cd.getUint16(p + 32, true);
    const name = dec.decode(new Uint8Array(cd.buffer, cd.byteOffset + p + 46, nlen)).replace(/\\/g, '/');
    for (let x = p + 46 + nlen, end = x + xlen; x + 4 <= end;) {
      const id = cd.getUint16(x, true), len = cd.getUint16(x + 2, true);
      if (id === 1) {
        let q = x + 4;
        if (usize === 0xffffffff) { usize = Number(cd.getBigUint64(q, true)); q += 8; }
        if (csize === 0xffffffff) { csize = Number(cd.getBigUint64(q, true)); q += 8; }
        if (lho === 0xffffffff) lho = Number(cd.getBigUint64(q, true));
      }
      x += 4 + len;
    }
    out.push({ name, method, csize, usize, lho, locked: !!(flags & 1), dir: name.endsWith('/') });
    p += 46 + nlen + xlen + clen;
  }
  return out;
}
// One file out of the archive. Uncompressed entries (most CBZs) aren't copied at all.
async function zipEntryBlob(file, e, type = '') {
  if (e.locked) throw new Error('The archive is password-protected');
  const h = new DataView(await file.slice(e.lho, e.lho + 30).arrayBuffer());
  if (h.getUint32(0, true) !== 0x04034b50) throw new Error('The archive is damaged');
  const start = e.lho + 30 + h.getUint16(26, true) + h.getUint16(28, true);
  const raw = file.slice(start, start + e.csize);
  if (e.method === 0) return new Blob([raw], { type });
  if (e.method === 8) return new Blob([await new Response(raw.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob()], { type });
  throw new Error('The archive uses a compression Stash can’t read');
}

// "(C97) [Circle (Artist)] Title (Parody) [English]" -> its parts, using the usual doujinshi naming.
function splitBrackets(t) {
  const O = '([{【（', C = ')]}】）';
  let s = String(t || '').trim(); const lead = [], trail = [];
  const head = () => { if (!O.includes(s[0])) return false; let d = 0; for (let i = 0; i < s.length; i++) { if (O.includes(s[i])) d++; else if (C.includes(s[i]) && --d === 0) { lead.push({ b: s[0], t: s.slice(1, i).trim() }); s = s.slice(i + 1).trim(); return true; } } return false; };
  const tailCut = () => { if (!C.includes(s[s.length - 1])) return false; let d = 0; for (let i = s.length - 1; i >= 0; i--) { if (C.includes(s[i])) d++; else if (O.includes(s[i]) && --d === 0) { trail.unshift({ b: s[i], t: s.slice(i + 1, -1).trim() }); s = s.slice(0, i).trim(); return true; } } return false; };
  while (s && head());
  while (s && tailCut());
  return { lead, core: s, trail };
}
function parseGalleryName(name) {
  const { lead, core, trail } = splitBrackets(name);
  const sq = lead.find(g => g.b === '[' || g.b === '【');
  if (!sq || !core) return null;
  const out = { title: core, artists: [], groups: [], series: [] };
  const m = sq.t.match(/^(.*?)\s*[(（]([^()（）]+)[)）]\s*$/);
  const names = s => s.split(/\s*[,、&]\s*/).map(x => x.trim()).filter(Boolean);
  if (m && m[1]) { out.groups = names(m[1]); out.artists = names(m[2]); } else out.artists = names(sq.t);
  for (const g of trail) if ((g.b === '(' || g.b === '（') && !/^(original|オリジナル|various|various series)$/i.test(g.t) && !/^\d+$/.test(g.t)) out.series.push(...names(g.t));
  return out;
}

function parseComicInfo(xml) {
  const d = new DOMParser().parseFromString(xml, 'application/xml');
  if (d.getElementsByTagName('parsererror').length) return null;
  const g = n => (d.getElementsByTagName(n)[0]?.textContent || '').trim();
  const list = n => g(n).split(/\s*[,;]\s*/).map(x => x.trim()).filter(Boolean);
  const series = g('Series'), title = g('Title');
  return {
    title: series && title && series !== title ? `${series} · ${title}` : title || series,
    artists: uniq([...list('Writer'), ...list('Penciller'), ...list('Inker')]),
    tags: uniq([...list('Tags'), ...list('Genre')]), characters: list('Characters'), groups: list('Teams'),
    src: (g('Web').split(/\s+/).find(u => /^https?:\/\//.test(u)) || ''),
  };
}
function fromKotatsu(ix) {
  if (!ix || typeof ix !== 'object' || !ix.title) return null;
  return {
    title: String(ix.title).trim(),
    artists: (Array.isArray(ix.authors) ? ix.authors : ix.author ? [ix.author] : []).map(String).filter(Boolean),
    tags: (Array.isArray(ix.tags) ? ix.tags : []).map(t => t?.title).filter(Boolean),
    src: /^https?:\/\//.test(ix.public_url || '') ? ix.public_url : '',
    chapters: ix.chapters && typeof ix.chapters === 'object' ? Object.values(ix.chapters).filter(c => c && typeof c === 'object') : [],
    cover: ix.cover_entry || '',
  };
}

// Reads one archive: its pages split into chapters, plus whatever it says about itself.
async function readBook(file) {
  const all = (await readZip(file)).filter(e => !e.dir && !/(^|\/)(__MACOSX\/|\.)/.test(e.name));
  const text = async e => (await zipEntryBlob(file, e)).text();
  const ij = all.find(e => /(^|\/)index\.json$/i.test(e.name)), ci = all.find(e => /(^|\/)comicinfo\.xml$/i.test(e.name));
  let kot = null, info = null;
  if (ij) try { kot = fromKotatsu(JSON.parse(await text(ij))); } catch {}
  if (ci) try { info = parseComicInfo(await text(ci)); } catch {}
  let pages = all.filter(e => PAGE_RE.test(e.name));
  if (kot?.cover) pages = pages.filter(e => e.name !== kot.cover);
  if (!pages.length) throw new Error('No pictures inside');
  let chapters;
  if (pages.every(e => KOTATSU_PAGE.test(stem(baseOf(e.name))))) {
    // Kotatsu names pages <branch>_<chapter><page>; 00000000_00000000 is its cover.
    pages = pages.filter(e => !/^0+_0+$/.test(stem(baseOf(e.name))));
    const groups = new Map();
    for (const e of pages) {
      const [, br, ch, pg] = stem(baseOf(e.name)).match(KOTATSU_PAGE);
      const key = `${br}_${ch}`;
      if (!groups.has(key)) groups.set(key, { key, br, ch: +ch, list: [] });
      groups.get(key).list.push({ e, pg: +pg });
    }
    const meta = (kot?.chapters || []).map(c => { let re = null; try { re = new RegExp(`^${c.entries}$`); } catch {} return { name: c.name || '', number: +c.number || 0, re }; });
    chapters = [...groups.values()].map(g => {
      const sample = stem(baseOf(g.list[0].e.name)), m = meta.find(c => c.re && c.re.test(sample));
      return { name: m?.name || '', order: m ? m.number : g.ch, pages: g.list.sort((a, b) => a.pg - b.pg).map(x => x.e) };
    }).sort((a, b) => a.order - b.order);
  } else {
    // Any other archive: pages in name order, and one chapter per folder if pictures sit in several folders.
    const dirOf = e => e.name.includes('/') ? e.name.slice(0, e.name.lastIndexOf('/')) : '';
    const dirs = [...new Set(pages.map(dirOf))].sort(natural);
    chapters = dirs.map(d => ({ name: dirs.length > 1 ? baseOf(d) : '', pages: pages.filter(e => dirOf(e) === d).sort((a, b) => natural(a.name, b.name)) }));
  }
  if (!chapters.some(c => c.pages.length)) throw new Error('No pictures inside');
  chapters = chapters.filter(c => c.pages.length);
  const fromName = parseGalleryName(stem(file.name));
  const book = {
    file, chapters, error: '',
    title: kot?.title || info?.title || fromName?.title || prettyName(file.name),
    artists: uniq([...(kot?.artists || []), ...(info?.artists || []), ...(kot || info?.artists?.length ? [] : fromName?.artists || [])]),
    groups: info?.groups?.length ? info.groups : fromName?.groups || [],
    series: fromName?.series || [], characters: info?.characters || [],
    tags: uniq([...(kot?.tags || []), ...(info?.tags || [])]),
    src: kot?.src || info?.src || '',
  };
  return book;
}

// A folder of chapter CBZs from Kotatsu, picked together with its index.json, becomes one book.
function joinKotatsuFolder(books, indexes) {
  const out = [...books];
  for (const ix of indexes) {
    const k = fromKotatsu(ix); if (!k || !k.chapters.length) continue;
    const parts = k.chapters.map(c => ({ c, b: out.find(b => !b.error && b.file.name === c.file) })).filter(x => x.b);
    if (!parts.length) continue;
    parts.sort((a, b) => (+a.c.number || 0) - (+b.c.number || 0));
    const joined = {
      file: null, files: parts.map(x => x.b.file), error: '', title: k.title, artists: k.artists, groups: [], series: [], characters: [],
      tags: uniq(k.tags), src: k.src,
      chapters: parts.flatMap(x => x.b.chapters.map((ch, i) => ({ ...ch, name: x.c.name || ch.name, file: x.b.file, part: i }))),
    };
    for (const x of parts) out.splice(out.indexOf(x.b), 1);
    out.push(joined);
  }
  return out;
}

// Files shared to the Android app from another app (Kotatsu's Share, the gallery, a file manager)
// arrive here: the app hands over a list, and each file is read through the app's own address.
async function receiveShared() {
  if (!NATIVE?.takeShared || !S.key) return;
  let link = '';
  try { link = NATIVE.takeSharedLink?.() || ''; } catch {}
  if (link && openLink(link)) return;
  let list = [];
  try { list = JSON.parse(NATIVE.takeShared() || '[]'); } catch {}
  if (!list.length) return;
  const note = toast(`Receiving ${plural(list.length, 'file')}…`, 300000);
  const files = [];
  for (const s of list) {
    try {
      const r = await fetch('/__shared/' + encodeURIComponent(s.id));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const blob = await r.blob();
      const name = s.name || 'file';
      const type = s.type && s.type !== 'application/octet-stream' ? s.type : (MIME[extOf(name)] || blob.type || '');
      files.push(new File([blob], name, { type, lastModified: Date.now() }));
    } catch (e) { console.warn('shared file', e); }
    finally { try { NATIVE.releaseShared(s.id); } catch {} }
  }
  note?.remove();
  if (!files.length) return toast('Couldn’t read the shared files', 4500);
  const backup = files.find(f => /\.stash$/i.test(f.name));
  if (backup) return importLibrary(backup);
  if (!files.some(f => isArchive(f) || isOtherArchive(f) || isMedia(f))) return toast('Stash can only take photos, videos and CBZ/ZIP files', 4500);
  $$('.overlay').forEach(o => { if (!o.dataset.busy) o._close?.(); });
  if (RD.open) closeReader();
  startUpload(files);
}
window.__stashShared = () => receiveShared();

async function startArchiveImport(archives, jsons = [], others = 0) {

  let books = [];
  for (const f of archives) {
    if (isOtherArchive(f)) { books.push({ file: f, error: 'RAR, 7z and TAR archives aren’t supported. Only CBZ/ZIP.', chapters: [] }); continue; }
    try { books.push(await readBook(f)); } catch (e) { books.push({ file: f, error: e?.message || String(e), chapters: [] }); }
  }
  const indexes = [];

  books = joinKotatsuFolder(books, indexes);
  reading?.remove?.();
  const good = books.filter(b => !b.error), bad = books.filter(b => b.error);
  if (!good.length) return toast(bad.length === 1 ? `Couldn’t import ${bad[0].file.name}: ${bad[0].error}` : 'None of those files could be imported', 6000);
  const pagesOf = b => b.chapters.reduce((a, c) => a + c.pages.length, 0);

  const m = modal(`<h3>Import ${plural(good.length, 'book')}</h3>
    <p class="summary">Titles, artists and tags come from the files when they include them.${others ? ` Skipping ${plural(others, 'other file')}.` : ''}</p>
    <div class="ar-list">${books.map(row).join('')}</div>

    <div class="field"><span class="l">Albums</span><div data-slot="albums"></div></div>
    ${multi ? `<label class="check-row"><input type="checkbox" id="arSplit" checked> For series with several chapters, make one post per chapter and put them in an album named after the series</label>` : ''}
    <label class="check-row"><input type="checkbox" id="arSkip" checked> Skip archives that are already in your stash</label>
    <div id="prog" hidden><div class="progress"><i></i></div><div class="hint" id="progTxt"></div></div>
    <div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" data-go>${I.upload}Import</button></div>`);
  const ti = chipInput({ values: [], source: 'tags', placeholder: 'e.g. favorites' });
  const ai = chipInput({ values: [], source: 'albums', placeholder: 'e.g. To read' });
  $('[data-slot="tags"]', m.el).replaceWith(ti.el); $('[data-slot="albums"]', m.el).replaceWith(ai.el);
  $('[data-go]', m.el).onclick = async () => {
    const extraTags = ti.get(), extraAlbums = ai.get(), split = $('#arSplit', m.el)?.checked ?? true, skip = $('#arSkip', m.el).checked;
    m.ov.dataset.busy = '1'; $$('button', m.el).forEach(b => b.disabled = true); $('#prog', m.el).hidden = false;
    const bar = $('#prog i', m.el), txt = $('#progTxt', m.el);
    const r = await busy(() => importBooks(good, { extraTags, extraAlbums, split, skip }, (done, total, label) => {
      bar.style.width = (done / Math.max(1, total) * 100) + '%'; txt.textContent = label;
    }));
    delete m.ov.dataset.busy; m.close();
    const out = [];
    if (r.posts) out.push(`imported ${plural(r.posts, split && good.some(b => b.chapters.length > 1) ? 'post' : 'book')}`);
    if (r.dup) out.push(`skipped ${r.dup} already in your stash`);
    if (r.failed) out.push(`${plural(r.failed, 'page')} couldn’t be read`);
    toast(cap(out.join(', ') || 'Nothing was imported'), 4500);

}

async function importBooks(books, { extraTags, extraAlbums, split, skip }, onProgress) {
  const have = new Set(S.all.map(i => i.afp).filter(Boolean));
  const total = books.reduce((a, b) => a + b.chapters.reduce((x, c) => x + c.pages.length, 0), 0);
  let done = 0, posts = 0, dup = 0, failed = 0;
  const fps = new Map();
  const fpOf = async f => { if (!fps.has(f)) fps.set(f, await fingerprint(f).catch(() => '')); return fps.get(f); };
  for (let bi = 0; bi < books.length; bi++) {
    const b = books[bi];
    const tags = uniq([
      ...extraTags, ...b.tags.map(normTag),
      ...b.artists.map(a => normTag('artist:' + a)), ...b.groups.map(g => normTag('group:' + g)),
      ...b.characters.map(c => normTag('character:' + c)), ...b.series.map(s => normTag('series:' + s)),
    ].filter(t => t && !/:$/.test(t)));
    const units = split && b.chapters.length > 1
      ? b.chapters.map((c, k) => ({ title: `${b.title} · ${c.name || `Chapter ${k + 1}`}`, pages: c.pages, file: c.file || b.file, key: k, albums: uniq([...extraAlbums, b.title]) }))
      : [{ title: b.title, pages: b.chapters.flatMap(c => c.pages.map(e => ({ e, file: c.file || b.file }))), file: null, key: 'all', albums: extraAlbums, mixed: true }];
    for (const u of units) {
      const list = u.mixed ? u.pages : u.pages.map(e => ({ e, file: u.file }));
      const srcFile = u.mixed ? (b.file || b.files?.[0]) : u.file;
      const afp = `${await fpOf(srcFile)}#${b.file ? u.key : `${b.files.indexOf(srcFile)}:${u.key}`}`;
      if (skip && afp && have.has(afp)) { dup++; done += list.length; onProgress(done, total, `Already in your stash: ${u.title}`); continue; }
      const lazy = list.map(({ e, file }) => {
        const name = baseOf(e.name), type = MIME[extOf(name)] || '';
        return { name, size: e.usize, load: async () => new File([await zipEntryBlob(file, e, type)], name, { type, lastModified: file.lastModified || Date.now() }) };
      });
      const r = await ingest(lazy, tags, u.albums, false, false, (i, n, name, frac = 0) => {
        onProgress(done + i + frac, total, `${books.length > 1 ? `Book ${bi + 1} of ${books.length}: ` : ''}${u.title} · page ${i + 1} of ${n}`);
      });
      done += list.length; failed += r.failed;
      let cover = null;
      if (r.ids.length > 1) cover = await makePost(r.ids, u.title);
      else if (r.ids.length === 1) { cover = S.byId.get(r.ids[0]); cover.title = u.title; }
      if (cover) {
        cover.afp = afp; if (b.src && !cover.src) cover.src = b.src;
        await saveMeta([cover]); have.add(afp); posts++;
      }
    }
  }
  changed();
  return { posts, dup, failed };
}

// What browse.js reported, checked and tidied, since it comes from a web page.
function cleanPost(p) {
  if (!p || typeof p !== 'object') return null;
  if (p.blocked) return { blocked: true };
  if (p.error) return { error: String(p.error).slice(0, 160) };
  if (!WEB[p.site]) return null;
  const files = (Array.isArray(p.files) ? p.files : []).slice(0, 3000).map((f, i) => {
    const alts = (Array.isArray(f?.alts) ? f.alts : []).map(String).filter(u => /^https:\/\//.test(u) && (siteOfUrl(u) || /^https:\/\/[^/]*\btwimg\.com\//.test(u))).slice(0, 8);
    let name = String(f?.name || '').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').slice(-80);
    if (!extOf(name)) name = `${name || String(i + 1).padStart(3, '0')}.${extOf(alts[0] || '') || 'jpg'}`;
    return { alts, name };
  }).filter(f => f.alts.length);
  const needs = p.site === 'x' && p.needs === 'video' ? 'video' : '';
  if (!files.length && !needs) return { error: 'No file found on this page' };
  const T = p.tags && typeof p.tags === 'object' ? p.tags : {};
  const grab = k => uniq((Array.isArray(T[k]) ? T[k] : []).slice(0, 400).map(t => String(t).slice(0, 120))
    .filter(t => !/^[:;]/.test(t.trim()))       // emoticon tags like :d
    .map(t => normTag(k === 'general' ? t.replace(/:/g, ' ') : t.replace(/:/g, '\uA789'))).map(t => t.replace(/\uA789/g, ':'))
    .filter(Boolean));
  const tags = {
    artist: grab('artist').map(t => t.replace(/\s*\(artist\)$/, '')).filter(Boolean), character: grab('character'),
    series: grab('series').filter(t => t !== 'original'), group: grab('group'), language: grab('language'),
    general: grab('general').filter(t => !TAG_JUNK.test(t)),
  };
  if (Object.values(tags).some(l => l.some(t => BLOCK_TAGS.has(t)))) return { blocked: true };
  const url = String(p.url || ''), page = String(p.page || '');
  if (siteOfUrl(url) !== p.site) return null;
  return {
    site: p.site, id: String(p.id || '').slice(0, 40), url: url.slice(0, 400), page: siteOfUrl(page) ? page.slice(0, 1000) : url,
    kind: ['video', 'book', 'set'].includes(p.kind) ? p.kind : 'image', files, tags, needs,
    title: String(p.title || '').replace(/\s+/g, ' ').trim().slice(0, 300), w: +p.w || 0, h: +p.h || 0,
    rating: ['general', 'safe', 'sensitive', 'questionable', 'explicit'].includes(p.rating) ? p.rating : '',
  };
}
function webTitle(p) {

  const tc = s => s.replace(/(^|[\s(-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
  const ch = p.tags.character.slice(0, 2).map(c => tc(c.replace(/\s*\([^)]*\)$/, '')));
  const se = p.tags.series[0] ? tc(p.tags.series[0].replace(/\s*\([^)]*\)$/, '')) : '';
  if (ch.length) return ch.join(', ') + (se ? ` (${se})` : '');
  if (se) return se;
  if (p.tags.artist[0]) return `${WEB[p.site].name} ${p.id} by ${p.tags.artist[0]}`;
  return `${WEB[p.site].name} ${p.id}`;
}
const WEB_GROUPS = [['artist', 'Artist'], ['character', 'Characters'], ['series', 'Series'], ['group', 'Group'], ['language', 'Language'], ['general', 'Tags']];
const webTag = (k, t) => k === 'general' ? t : `${k}:${t}`;
const webTags = p => WEB_GROUPS.flatMap(([k]) => p.tags[k].map(t => webTag(k, t)));

// X: the side you're on, unless X marks the post as sensitive.
const webSfw = p => p.site === 'x' ? modeSfw() && p.rating !== 'sensitive' : p.rating === 'general' || p.rating === 'safe';

/* ---------- Rule34 favorites: save them all ---------- */
// browse.js lists them, then reads one post at a time, slowly. Each goes through the save queue like a post saved
// by hand, so the minors filter (in browse.js, cleanPost and bwEnqueue) checks every one of them.
// If the page changes (or the browser closes), it carries on from where it was once a Rule34 page is open again.
const FAV_ALBUM = 'Rule34 favorites';
const FAVS = { phase: '', user: '', at: '', found: 0, left: [], n: 0, done: 0, saved: 0, failed: 0, gone: 0, have: 0, skipped: 0,
  waitUntil: 0, why: '', slow: false, tries: {}, dlLevel: 0, tick: 0 };
const favFresh = () => ({ found: 0, left: [], n: 0, done: 0, saved: 0, failed: 0, gone: 0, have: 0, skipped: 0, waitUntil: 0, why: '', slow: false, tries: {}, dlLevel: 0 });
// A favorite whose download Rule34 refused is read and tried again after each of these waits (seconds), longer
// each time; one file is tried at most FAV_DL_TRIES times. After the last wait in a row, the run stops for now.
const FAV_DL_WAITS = [30, 60, 120, 300, 600], FAV_DL_TRIES = 3;
const favPushedBack = msg => /said (403|429|5\d\d)|No connection|web page instead/i.test(msg || '');
const r34PostUrl = id => 'https://rule34.xxx/index.php?page=post&s=view&id=' + id;
function bwFavUser() {
  if (BW.site !== 'rule34' || siteOfUrl(BW.url) !== 'rule34') return '';
  try {
    const q = new URL(BW.url).searchParams, id = q.get('id') || '';
    return q.get('page') === 'favorites' && q.get('s') === 'view' && /^\d+$/.test(id) ? id : '';
  } catch { return ''; }
}
// Calls one of browse.js's functions once the page has it (it's added after each page loads).
function bwCall(fn, arg) {
  FAVS.at = noHash(BW.url);
  const a = JSON.stringify(arg ?? null);
  try { NATIVE.browseEval(`(function t(n){var b=window.__stashB;if(b&&b.${fn})b.${fn}(${a});else if(n<25)setTimeout(function(){t(n+1)},300)})(0)`); } catch {}
}
function favStart() {
  const user = bwFavUser(); if (!user || FAVS.phase) return;
  Object.assign(FAVS, favFresh(), { phase: 'list', user });
  bwCall('favList', user); bwDrawBottom(); favBg();
}
const favPct = () => FAVS.n ? Math.min(100, Math.round(FAVS.done / FAVS.n * 100)) : 0;
// The app's notification while saving (it keeps Stash going in the background): a bar from 0 to 100%.
function favBg() {
  if (!NATIVE?.bgProgress) return;
  const wait = favWaitText();
  try {
    if (FAVS.phase === 'list') NATIVE.bgProgress(wait || `Reading favorites · ${FAVS.found} found`, 0, 0);
    else if (FAVS.phase === 'get') NATIVE.bgProgress(wait ? `${wait} · ${FAVS.done} of ${FAVS.n} done` : `Saving favorites · ${FAVS.done} of ${FAVS.n}`, FAVS.done, FAVS.n);
  } catch {}
}
// Rule34 pushed back (or the connection dropped): browse.js waits, then tries again. Shown with a countdown.
function favWaiting(secs, why) {
  FAVS.waitUntil = Date.now() + Math.min(3600, Math.max(1, +secs || 30)) * 1000;
  FAVS.why = why === 'offline' ? 'offline' : 'busy'; FAVS.slow = true;
  if (!FAVS.tick) FAVS.tick = setInterval(() => {
    if (!FAVS.phase || Date.now() >= FAVS.waitUntil) { clearInterval(FAVS.tick); FAVS.tick = 0; }
    bwDrawStatus(); favBg();
  }, 1000);
  bwDrawStatus(); favBg();
}
// The notification has room for the whole sentence; the bar in the app gets the short one.
function favWaitText(short = false) {
  if (!FAVS.waitUntil) return '';
  const s = Math.max(0, Math.ceil((FAVS.waitUntil - Date.now()) / 1000));
  const t = s < 60 ? `${s} s` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  if (short) return `${FAVS.why === 'offline' ? 'No connection' : 'Rule34 says wait'} · ${s ? t : 'retrying…'}`;
  return `${FAVS.why === 'offline' ? 'No connection' : 'Rule34 asked to slow down'} · ${s ? `trying again in ${t}` : 'trying again…'}`;
}
function favEnd(note = '') {
  const was = FAVS.phase;
  if (FAVS.tick) { clearInterval(FAVS.tick); FAVS.tick = 0; }
  FAVS.phase = ''; FAVS.left = []; FAVS.at = ''; FAVS.waitUntil = 0; bwDrawBottom();
  if (was && NATIVE?.bgDone) try { NATIVE.bgDone(note); } catch {}
}
// Stop in the app's notification.
window.__stashBgStop = () => favStop();
function favSummary(stopped) {
  const s = FAVS, bits = [];
  if (s.failed) bits.push(`${s.failed} couldn’t be saved`);
  if (s.gone) bits.push(`${s.gone} ${s.gone === 1 ? 'isn’t' : 'aren’t'} on Rule34 anymore`);
  if (s.skipped) bits.push(`${s.skipped} blocked`);
  return `${stopped ? 'Stopped. ' : ''}Saved ${plural(s.saved, 'favorite')} to “${FAV_ALBUM}”${bits.length ? ` (${bits.join(', ')})` : ''}`;
}
// Stop from the app, or (refused = 'busy' or 'offline') because Rule34 kept refusing even after the waits.
function favStop(refused = '') {
  if (!FAVS.phase) return;
  try { NATIVE.browseEval('window.__stashB&&window.__stashB.favStop&&window.__stashB.favStop()'); } catch {}
  BWQ.list = BWQ.list.filter(j => { if (!j.fav) return true; BWQ.busy.delete(j.p.url); return false; });
  let note = '';
  if (FAVS.phase === 'get' && refused) {
    const rest = FAVS.n - FAVS.done;
    note = `${favSummary(false)}. ${refused === 'offline' ? 'The connection kept dropping' : 'Rule34 kept asking Stash to slow down'}, so it stopped for now. ` +
      `Tap “Save all favorites” again in an hour or so to save the other ${rest}.`;
    toast(note, 12000);
  } else if (FAVS.phase === 'get') toast(favSummary(true), 6000);
  favEnd(note);
}
async function favEvent(f) {
  if (!FAVS.phase || !f || typeof f !== 'object') return;
  if (f.phase === 'wait') { if (FAVS.phase === 'list' || FAVS.phase === 'get') favWaiting(+f.secs, f.why); return; }
  if (f.phase === 'refused') { if (FAVS.phase === 'get') favStop(f.why === 'offline' ? 'offline' : 'busy'); return; }
  if (f.phase === 'list' && FAVS.phase === 'list') { FAVS.found = Math.max(0, +f.found || 0); FAVS.waitUntil = 0; bwDrawStatus(); favBg(); return; }
  if (f.phase === 'error') { favEnd(); toast(String(f.error || 'Couldn’t read your favorites').slice(0, 160), 5000); return; }
  if (f.phase !== 'ids' || FAVS.phase !== 'list') return;
  const ids = uniq((Array.isArray(f.ids) ? f.ids : []).map(String).filter(id => /^\d+$/.test(id)));
  const have = new Set(S.all.filter(i => !i.parent && i.src).map(i => i.src));
  const left = ids.filter(id => !have.has(r34PostUrl(id)));
  FAVS.have = ids.length - left.length; FAVS.skipped = Math.max(0, +f.skipped || 0);
  FAVS.phase = 'ask'; bwDrawBottom();
  const blockedNote = FAVS.skipped ? `${plural(FAVS.skipped, 'favorite')} won’t be saved because of blocked tags. ` : '';
  if (!left.length) { toast(ids.length ? `All your Rule34 favorites are already in your stash. ${blockedNote}` : `No favorites found. ${blockedNote}`, 5000); favEnd(); return; }
  const ok = await confirmDialog(`Save ${plural(left.length, 'favorite')}?`,
    `${FAVS.have ? `${FAVS.have} already in your stash will be skipped. ` : ''}${blockedNote}They go into the album “${FAV_ALBUM}”. ` +
    'It goes slowly so Rule34 doesn’t block you. You can keep browsing Rule34 meanwhile.', 'Save all', false);
  if (FAVS.phase !== 'ask') return;
  if (!ok) { favEnd(); return; }
  Object.assign(FAVS, { phase: 'get', left, n: left.length, done: 0 });
  bwCall('favGet', left); bwDrawBottom(); favBg();
}
// One favorite read by browse.js: queued to save, or counted as skipped.
function favPost(raw, post) {
  if (FAVS.phase !== 'get') return;
  const id = String(raw?.id || post?.id || '');
  if (!FAVS.left.includes(id)) return;
  FAVS.left = FAVS.left.filter(x => x !== id);
  FAVS.waitUntil = 0;
  if (post?.blocked) favDone('skipped');
  else if (!post || post.error || post.site !== 'rule34') favDone(raw?.gone ? 'gone' : 'failed');
  else if (savedItem(post.url) || BWQ.busy.has(post.url)) favDone('have');
  else bwEnqueue(post, { title: webTitle(post), tags: webTags(post), albums: [FAV_ALBUM], sfw: webSfw(post), quiet: true, fav: true });
  bwDrawStatus();
}
function favDone(how) {
  if (FAVS.phase !== 'get') return;
  FAVS.done++; FAVS[how]++;
  if (FAVS.left.length || BWQ.list.some(j => j.fav) || BWQ.cur?.fav) { bwDrawStatus(); favBg(); return; }
  const sum = favSummary(false);
  toast(sum, 7000);
  favEnd(sum);
}
// A new page finished loading: carry on if it's a Rule34 page.
function favResume() {
  if (!FAVS.phase || BW.site !== 'rule34' || siteOfUrl(BW.url) !== 'rule34' || noHash(BW.url) === FAVS.at) return;
  if (FAVS.phase === 'list') bwCall('favList', FAVS.user);
  else if (FAVS.phase === 'get' && FAVS.left.length) bwCall('favGet', { ids: FAVS.left, until: FAVS.waitUntil, slow: FAVS.slow });
}
// A favorite's download finished. If Rule34 refused it, it goes back on the list and is read and tried again
// after a wait (browse.js waits, so it keeps going in the background); several refusals in a row stop the run.
function favJobDone(j, ok, err) {
  if (FAVS.phase !== 'get') return;
  if (ok) { FAVS.dlLevel = 0; return favDone('saved'); }
  const id = String(j.p.id || ''), tries = (FAVS.tries[id] || 0) + 1;
  if (!favPushedBack(err) || !/^\d+$/.test(id) || tries >= FAV_DL_TRIES) return favDone('failed');
  if (FAVS.dlLevel >= FAV_DL_WAITS.length) return favStop(/No connection/.test(err) ? 'offline' : 'busy');
  const secs = FAV_DL_WAITS[FAVS.dlLevel];
  FAVS.dlLevel++; FAVS.tries = { ...FAVS.tries, [id]: tries };
  FAVS.left = [id, ...FAVS.left.filter(x => x !== id)];

function favStatusHTML() {
  const stop = '<button type="button" class="bw-stop" data-bw="favstop">Stop</button>', wait = favWaitText(true);
  if (FAVS.phase === 'list') return `<span class="spin"></span><span class="t">${wait ? esc(wait) : `Reading your favorites… <b>${FAVS.found}</b> found`}</span>${stop}`;
  if (FAVS.phase === 'ask') return '<span class="t">Favorites found</span>';
  const away = BW.site !== 'rule34' && FAVS.left.length;
  return `${away ? '' : '<span class="spin"></span>'}<span class="t">${away ? 'Favorites paused · open Rule34 to go on' : wait ? esc(wait) : `Saving favorites · <b>${FAVS.done}</b> of ${FAVS.n} · ${favPct()}%`}</span>` +
    `<div class="pb"><i style="width:${favPct()}%"></i></div>${stop}`;
}

/* ---------- saving: downloads by the app, added one file at a time as they arrive ---------- */
const BWQ = { list: [], cur: null, busy: new Set() };
const DLJ = new Map(); let dlSeq = 0;
function dlEvent(type, d) {
  const j = DLJ.get(+d.job);
  const drop = id => { if (id) try { NATIVE.releaseShared(String(id)); } catch {} };
  if (type === 'file') {
    const w = j?.wait[+d.index];
    if (!j || !w || w.done || j.stale) return drop(d.id);
    w.done = true; w.res(d);
  } else if (type === 'jobdone' && j) {
    j.wait.forEach(w => { if (!w.done) { w.done = true; w.res({ error: d.cancelled ? 'Stopped' : 'Not downloaded' }); } });
    DLJ.delete(+d.job);
  }
}
function startDownload(p) {
  const job = ++dlSeq;
  const wait = p.files.map(() => { const w = { done: false, used: false }; w.p = new Promise(r => { w.res = v => { w.val = v; r(v); }; }); return w; });
  const j = { wait, stale: false }; DLJ.set(job, j);
  try { NATIVE.browseFetch(JSON.stringify({ referer: p.page, files: p.files.map(f => ({ alts: f.alts })) }), job); }
  catch { DLJ.delete(job); wait.forEach(w => { w.done = true; w.res({ error: 'Couldn’t start the download' }); }); }
  return { job, j };
}

async function bwRun() {

async function bwSaveJob(q) {

        if (!res.ok) throw new Error('HTTP ' + res.status);

        let type = /^(image|video)\//.test(r.type || '') ? r.type : (MIME[extOf(f.name)] || blob.type || '');

        const right = Object.keys(MIME).find(k => MIME[k] === type);

  }));

    r = await ingest(lazy, q.tags, q.albums, false, false, (i, n, name, frac = 0) => { q.done = i; q.frac = (i + frac) / n; bwDrawStatus(); }, { sfw: q.sfw });

  if (p.site === 'x') {
    // One item per picture or video, each linking back to the post.
    const items = r.ids.map(id => S.byId.get(id)).filter(Boolean), n = items.length;
    items.forEach((it, k) => {
      it.title = n > 1 ? `${q.title} (${k + 1}/${n})` : q.title;

    else if (r.failed) toast(`${plural(r.failed, 'file')} of “${q.title}” couldn’t be downloaded`, 5000);
    return;
  }
  if (r.ids.length > 1) item = await makePost(r.ids, q.title);
  else { item = S.byId.get(r.ids[0]); if (item) item.title = q.title; }
  if (!item) throw new Error('couldn’t make the post');
  item.src = p.url; item.looked = Date.now();
  if (p.kind === 'book') item.afp = 'web:' + p.url;
  await saveMeta([item]);
  BW.dirty = true; if (!BW.open) { BW.dirty = false; render({ keep: true }); }
  const miss = r.failed, where = q.sfw ? ' to SFW' : '';
  if (q.quiet) { if (miss) toast(`${plural(miss, 'file')} of “${q.title}” couldn’t be downloaded`, 5000); return; }
  actionToast(miss ? `Saved “${q.title}”${where}, but ${plural(miss, p.kind === 'book' ? 'page' : 'file')} couldn’t be downloaded` : `Saved “${q.title}”${where}`, 'Open',
    () => { closeBrowser(); openItemAnySide(item); }, miss ? 8000 : 5000);
}
function actionToast(msg, label, fn, ms = 5000) {

const TRASH_DAYS = 30;
function trashTop(both = false) {
  const ids = new Set(S.trash.map(m => m.id));

  metas.forEach(m => { m.deleted = now; });
  try { await dbPutMeta(metas); } catch (e) { metas.forEach(m => { delete m.deleted; }); throw e; }
  const set = new Set(ids);
  setItems(S.all.filter(i => !set.has(i.id)));
  S.trash.push(...metas);
  ids.forEach(id => S.selected.delete(id));
  S.navList = S.navList.filter(id => !set.has(id));
  changed(); updateTrashLink();
}
const withPages = ids => { const set = new Set(ids); for (const m of S.trash) if (m.parent && set.has(m.parent)) set.add(m.id); return set; };
async function restoreItems(ids) {

  try { await dbPutMeta(metas); } catch (e) { metas.forEach(m => { m.deleted = Date.now(); }); throw e; }
  S.trash = S.trash.filter(m => !set.has(m.id));

}
async function purgeItems(ids) {

  await dbDelete(all);
  await dbDeleteKV(all.map(id => 'pv:' + id)).catch(() => {});
  const set = new Set(all);
  S.trash = S.trash.filter(m => !set.has(m.id));

}
