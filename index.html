/* ================= look-alike pictures ================= */
// Finds the same picture saved more than once, at another size or quality. Each photo gets a small
// fingerprint from its thumbnail: 64 steps of "brighter or darker than the next spot". Photos whose
// fingerprints almost match, and whose shapes match, are shown together. Videos and doujinshi are left out.
const LA_DIFF = 6;      // how many of the 64 steps may differ
const LA_SHAPE = 0.06;  // how much the width-to-height ratio may differ
const LA_SAVE_EVERY = 100;
const LA = { busy: false, stop: false, done: 0, total: 0, sel: new Set(), seen: new Set() };
const laCandidates = () => topItems().filter(i => i.type !== 'video' && !(i.pages?.length > 1) && i.hasThumb);
const popcount = x => { x -= x >>> 1 & 0x55555555; x = (x & 0x33333333) + (x >>> 2 & 0x33333333); return Math.imul(x + (x >>> 4) & 0x0f0f0f0f, 0x01010101) >>> 24; };
async function pictureFingerprint(id) {
  const url = await thumbURL(id); if (!url) return null;
  const img = new Image(); img.src = url; await img.decode();
  const c = document.createElement('canvas'); c.width = 9; c.height = 8;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, 9, 8);
  const d = g.getImageData(0, 0, 9, 8).data, lum = k => d[k] * 299 + d[k + 1] * 587 + d[k + 2] * 114;
  let hi = 0, lo = 0;
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const k = (y * 9 + x) * 4, bit = lum(k) > lum(k + 4) ? 1 : 0;
    if (y < 4) hi = (hi << 1 | bit) >>> 0; else lo = (lo << 1 | bit) >>> 0;
  }
  return hi.toString(16).padStart(8, '0') + lo.toString(16).padStart(8, '0');
}
// Fingerprints the photos that don't have one yet, saving them as it goes so a second visit is instant.
async function laScan() {
  if (LA.busy) return;
  const todo = laCandidates().filter(i => !i.ph);
  Object.assign(LA, { busy: true, stop: false, done: 0, total: todo.length });
  let batch = [];
  const flush = async () => { if (batch.length) { const b = batch; batch = []; await dbPutMeta(b).catch(e => console.warn(e)); } };
  try {
    for (const it of todo) {
      if (LA.stop || !S.key) break;
      try { const h = await pictureFingerprint(it.id); it.ph = h || '-'; } catch { it.ph = '-'; }
      batch.push(it); LA.done++;
      if (batch.length >= LA_SAVE_EVERY) await flush();
      laProgress();
    }
    await flush();
  } finally { LA.busy = false; }

}
function laProgress() {
  const bar = $('.la-scan .progress i'), n = $('#laN');
  if (bar) bar.style.width = (LA.total ? LA.done / LA.total * 100 : 0).toFixed(1) + '%';
  if (n) n.textContent = `${LA.done.toLocaleString()} of ${LA.total.toLocaleString()} photos`;

const laPair = (a, b) => a < b ? a + '|' + b : b + '|' + a;
// Groups of look-alikes, the best copy (most pixels, then biggest file) first.
function laGroups() {

  const n = list.length, hi = new Uint32Array(n), lo = new Uint32Array(n), shape = new Float64Array(n);
  list.forEach((it, k) => { hi[k] = parseInt(it.ph.slice(0, 8), 16); lo[k] = parseInt(it.ph.slice(8), 16); shape[k] = it.width && it.height ? it.width / it.height : 0; });

async function fingerprint(f) {

  const tail = f.size > K ? new Uint8Array(await f.slice(Math.max(K, f.size - K)).arrayBuffer()) : new Uint8Array(0);
  const buf = new Uint8Array(head.length + tail.length); buf.set(head); buf.set(tail, head.length);
  return f.size + ':' + toB64(await crypto.subtle.digest('SHA-256', buf)).slice(0, 24);
}

  for (let i = 0; i < files.length; i++) {
    let f = files[i]; onProgress(i, files.length, f.name);
    if (f.load) { try { f = await f.load(); } catch (e) { console.error(e); failed++; continue; } }
    let fp = null;
    try { fp = await fingerprint(f); } catch {}
    if (skipDup && fp && fps.has(fp)) { dup++; kept.push(f); continue; }
    const video = isVideoFile(f);
    let info = { thumb: null };
    try { info = video ? await videoInfo(f) : await imageInfo(f); } catch {}
    let pv = null;
    if (video) { try { pv = await previewFrames(f); } catch {} }
    const meta = {
      id: uid(), title: useName ? prettyName(f.name) : '', name: f.name,
      type: video ? 'video' : 'image', mime: f.type || MIME[extOf(f.name)] || '',
      size: f.size, width: info.w || 0, height: info.h || 0, duration: info.duration || null,
      tags: [...tags], albums: [...albums], fav: false, views: 0, added: base - i, hasThumb: !!info.thumb, hasPv: !!pv, fp,
      ...(sfw ? { sfw: true } : {}),

      const fileRec = await encryptFile(f, (a, b) => { if (b > 2) onProgress(i, files.length, f.name, a / b); });
      await dbPutItem(await encMeta(meta), fileRec, thumbRec);
      if (pv) await putPreview(meta.id, pv).catch(() => {});
      addItem(meta);

      console.error(e);
      if (isQuota(e)) { toast(`Storage is full. Stopped after ${plural(ok, 'file')}.`, 6000); break; }

async function exportLibrary() {
  if (!S.all.length) return toast('Nothing to export yet');
  try {
    const [files, thumbs, metas] = await Promise.all([dbAllKV('files'), dbAllKV('thumbs'), dbAllKV('meta')]);
    const parts = [], items = []; let off = 0;
    const push = blob => { const r = { off, len: blob.size }; parts.push(blob); off += blob.size; return r; };
    for (const m of S.all) {
      const mr = metas.get(m.id); if (!mr) continue;
      const e = { id: m.id, m: { iv: toB64(mr.iv), d: toB64(mr.data) } };
      const t = thumbs.get(m.id); if (t) e.t = { iv: toB64(t.iv), ...push(new Blob([t.data])) };
      const f = files.get(m.id); if (f) e.f = { chunks: f.chunks.map(c => ({ iv: toB64(c.iv), ...push(c.blob) })) };
      items.push(e);
    }
    const v = S.vault;
    const keyInfo = v.raw ? { rawkey: toB64(v.raw) } : { salt: toB64(v.salt), iter: v.iter, wiv: toB64(v.wiv), wrapped: toB64(v.wrapped) };
    const header = enc.encode(JSON.stringify({ app: 'stash', v: 2, vid: v.vid, ...keyInfo, exported: Date.now(), items }));
    const blob = new Blob(['STASHBK2' + String(header.length).padStart(12, '0'), header, ...parts], { type: 'application/octet-stream' });
    const where = await saveBlob(blob, `backup-${new Date().toISOString().slice(0, 10)}.stash`);
    toast(where ? `Backup saved to ${where} (${fmtSize(blob.size)})` : `Backup ready: ${fmtSize(blob.size)}`, where ? 5000 : 2800);
  } catch (e) { console.error(e); toast('Export failed: ' + (e?.message || e)); }
}

        } else {
          const miv = fromB64(e.m.iv), mct = fromB64(e.m.d).buffer;
          meta = clean(await decMeta({ iv: miv, data: mct }, same ? S.key : bkey)); delete meta.deleted;
          if (S.byId.has(meta.id)) { skipped++; continue; }
          if (e.t) {
            const iv = fromB64(e.t.iv), ct = await slice(e.t.off, e.t.len).arrayBuffer();
            thumbRec = same ? { iv, data: ct } : await sealRec(await unseal(bkey, iv, ct));
          }
          if (e.f) {
            const chunks = [];
            for (const c of e.f.chunks) {
              const iv = fromB64(c.iv), part = slice(c.off, c.len);
              if (same) chunks.push({ iv, blob: part });
              else { const s = await seal(S.key, await unseal(bkey, iv, await part.arrayBuffer())); chunks.push({ iv: s.iv, blob: new Blob([s.ct]) }); }
            }
            fileRec = { chunks };
          }
        }
        meta.hasThumb = !!thumbRec;
        metaRec = await encMeta(meta);
        await dbPutItem(metaRec, fileRec, thumbRec);
        addItem(meta); added++;
        if (S.trash.some(t => t.id === meta.id)) { S.trash = S.trash.filter(t => t.id !== meta.id); updateTrashLink(); }
      }
    } catch (err) { console.error(err); toast(isQuota(err) ? 'Storage is full; import stopped early' : 'Import stopped: ' + (err?.message || err), 6000); }
  });
  changed(); delete m.ov.dataset.busy; m.close();
  toast(`Imported ${plural(added, 'item')}${skipped ? `, ${skipped} already here` : ''}`);
  if (S.key) render();
}

/* Items saved by the first (unlocked) version get encrypted and moved in automatically. */
let migrated = false;
async function migrateLegacy() {
  if (migrated) return; migrated = true;
  try { if (!indexedDB.databases || !(await indexedDB.databases()).some(d => d.name === 'stash-library')) return; } catch { return; }
  let old;
  try { old = await new Promise((res, rej) => { const r = indexedDB.open('stash-library'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } catch { return; }
  const drop = () => new Promise(r => { try { old.close(); } catch {} const d = indexedDB.deleteDatabase('stash-library'); d.onsuccess = d.onerror = d.onblocked = () => r(); });
  if (!old.objectStoreNames.contains('meta')) return drop();
  const metas = await reqP(old.transaction('meta').objectStore('meta').getAll());
  if (!metas.length) return drop();
  const m = modal(`<h3>Locking your existing items</h3><p class="summary">Found ${plural(metas.length, 'item')} saved before you set a password. Encrypting them and moving them in.</p><div class="progress"><i></i></div><div class="hint" id="migTxt"></div>`);
  m.ov.dataset.busy = '1';
  let moved = 0, ok = true;
  await busy(async () => {
    try {
      for (let k = 0; k < metas.length; k++) {
        $('.progress i', m.el).style.width = (k / metas.length * 100) + '%';
        $('#migTxt', m.el).textContent = `${k + 1} of ${metas.length}`;
        const meta = clean(metas[k]);
        if (S.byId.has(meta.id)) continue;
        const tx = old.transaction(['files', 'thumbs']);
        const [f, t] = await Promise.all([reqP(tx.objectStore('files').get(meta.id)), reqP(tx.objectStore('thumbs').get(meta.id))]);
        const fileRec = f ? await encryptFile(f) : null;
        const thumbRec = t ? await sealRec(await t.arrayBuffer()) : null;
        meta.hasThumb = !!thumbRec;
        await dbPutItem(await encMeta(meta), fileRec, thumbRec);
        addItem(meta); moved++;
      }
    } catch (e) { ok = false; console.error(e); toast('Moving older items stopped: ' + (e?.message || e), 6000); }
  });
  if (ok) { await drop(); toast(`Moved ${plural(moved, 'item')} into your locked library`); } else { try { old.close(); } catch {} }
  changed(); delete m.ov.dataset.busy; m.close();
  if (S.key) render({ keep: true });
}

/* ================= video memory ================= */
function attachVideoMemory(v, it) {
  v.addEventListener('loadedmetadata', () => {
    if (S.settings.resume && it.pos > 5 && isFinite(v.duration) && it.pos < v.duration - 8) { v.currentTime = it.pos; toast(`Resumed at ${fmtDur(it.pos)}`, 1800); }
  }, { once: true });
  let last = 0;
  const save = force => {
    if (!S.key || !S.byId.has(it.id)) return;
    const now = Date.now(); if (!force && now - last < 5000) return; last = now;
    const d = v.duration; if (!isFinite(d) || d < 30) return;
    let p = v.currentTime; if (p > d - 8 || p < 3) p = 0;
    if (Math.abs((it.pos || 0) - p) < 1) return;
    it.pos = p; it.posAt = p ? now : 0;
    dbPutMeta([it]).catch(() => {});
  };
  v.addEventListener('timeupdate', () => save(false));
  v.addEventListener('pause', () => save(true));
  v.addEventListener('ended', () => { if (it.pos) { it.pos = 0; it.posAt = 0; dbPutMeta([it]).catch(() => {}); } });
  v._save = () => save(true);
}

// Random picks from whatever you're looking at: a section, album, tag or search. From the home page it picks from everything.
const SCOPE_NAMES = { videos: 'videos', photos: 'photos', doujinshi: 'doujinshi', albums: 'your albums', album: 'this album', tag: 'this tag', search: 'these results', favorites: 'favorites', untagged: 'untagged items', foryou: 'For you', rankings: 'the ranking' };

  const { parts } = parseHash(), view = parts[0] || '';

  else if (view === 'item' && randomScope) { pool = S.navList.map(id => S.byId.get(id)).filter(Boolean); scope = randomScope; }
  else if (LIST_VIEWS.has(view) && view) { pool = S.navList.map(id => S.byId.get(id)).filter(Boolean); scope = view; }
  else pool = topItems();
  if (view === 'item' && pool.length > 1) pool = pool.filter(i => i.id !== parts[1]);
  if (!pool.length) return toast('Nothing here to pick from yet');
  const pick = pool[Math.floor(Math.random() * pool.length)];
  if (scope && SCOPE_NAMES[scope]) toast(`Random from ${SCOPE_NAMES[scope]}`, 1400);
  randomScope = scope;
  if (scope === 'albums') S.navList = pool.map(i => i.id);
  location.hash = '#/item/' + pick.id;
}

  const pick = i => {
    const [n] = opts[i], { start, neg } = info();
    inp.value = inp.value.slice(0, start) + (neg ? '-' : '') + (/\s/.test(n) ? `"${n}"` : n) + ' ';
    hide(); inp.focus();
  };
  inp.addEventListener('input', show);
  inp.addEventListener('focus', show);
  inp.addEventListener('blur', () => setTimeout(hide, 150));
  inp.addEventListener('keydown', e => {
    if (!box.classList.contains('open')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); hl = (hl + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length;
      $$('div', box).forEach((d, i) => d.classList.toggle('hl', i === hl));
    } else if ((e.key === 'Enter' && hl >= 0) || e.key === 'Tab') { e.preventDefault(); pick(Math.max(hl, 0)); }
    else if (e.key === 'Escape') { e.stopPropagation(); hide(); }
  });
  box.addEventListener('mousedown', e => { e.preventDefault(); const d = e.target.closest('[data-i]'); if (d) pick(+d.dataset.i); });
  form.addEventListener('submit', hide);
}

/* ================= UI primitives ================= */
function toast(msg, ms = 2800) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, ms);
  return t;
}
function modal(html, { onClose } = {}) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(ov); document.body.classList.add('modal-open');
  bwSync(); // over the in-app browser, its site view steps aside while this is open
  const close = () => { if (!ov.isConnected) return; ov.remove(); if (!$('.overlay')) document.body.classList.remove('modal-open'); bwSync(); onClose?.(); };
  let down = false;
  ov.addEventListener('mousedown', e => { down = e.target === ov; });
  ov.addEventListener('click', e => {
    if (ov.dataset.busy) return;
    if ((e.target === ov && down) || e.target.closest('[data-close]')) close();
    down = false;
  });
  ov._close = close;
  bwSync();
  return { el: $('.modal', ov), ov, close };
}
function confirmDialog(title, text, ok = 'Delete', danger = true) {
  return new Promise(res => {
    let v = false;
    const m = modal(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="foot"><button class="btn" data-close>Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(ok)}</button></div>`, { onClose: () => res(v) });
    $('[data-ok]', m.el).onclick = () => { v = true; m.close(); };
  });
}
function promptDialog(title, value, ok = 'Save', hint = '', type = 'text') {
  return new Promise(res => {
    let v = null;
    const m = modal(`<h3>${esc(title)}</h3>${hint ? `<p class="summary" style="margin-top:-6px">${esc(hint)}</p>` : ''}<input class="input" id="pIn" type="${type}" value="${esc(value)}" autocomplete="off">
      <div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" data-ok>${esc(ok)}</button></div>`, { onClose: () => res(v) });
    const inp = $('#pIn', m.el);
    const go = () => { v = inp.value; m.close(); };
    $('[data-ok]', m.el).onclick = go;
    inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    setTimeout(() => { inp.focus(); inp.select(); }, 30);
  });
}
function chipDialog(title, source, limitTo, ok) {
  return new Promise(res => {
    let v = null;
    const m = modal(`<h3>${esc(title)}</h3><div data-slot></div>${limitTo ? '<div class="hint">Pick from the ones these items have.</div>' : '<div class="hint">Press Enter or a comma after each one.</div>'}
      <div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" data-ok>${esc(ok)}</button></div>`, { onClose: () => res(v) });
    const ci = chipInput({ source, limitTo, placeholder: source === 'tags' ? 'Type a tag' : 'Type an album name' });
    $('[data-slot]', m.el).replaceWith(ci.el);
    $('[data-ok]', m.el).onclick = () => { v = ci.get(); m.close(); };
    setTimeout(() => ci.input.focus(), 30);
  });
}

function chipInput({ values = [], source = 'tags', placeholder = '', limitTo = null }) {
  const norm = source === 'tags' ? normTag : normAlbum;
  const vals = uniq(values.map(norm), v => v.toLowerCase());
  const root = document.createElement('div'); root.className = 'chips';
  const input = document.createElement('input');
  input.setAttribute('autocomplete', 'off'); input.setAttribute('autocapitalize', 'off'); input.spellcheck = false;
  input.setAttribute('enterkeyhint', 'enter');
  const sug = document.createElement('div'); sug.className = 'suggest';
  let hl = -1, opts = [];
  const pool = () => limitTo || [...(source === 'tags' ? counts().tags : counts().albums).entries()];
  function draw() {
    $$('.chip', root).forEach(c => c.remove());
    vals.forEach((v, i) => {
      const c = document.createElement('span'); c.className = 'chip';
      c.innerHTML = `<span>${esc(v)}</span><button type="button" aria-label="Remove ${esc(v)}">×</button>`;
      c.querySelector('button').onclick = e => { e.stopPropagation(); vals.splice(i, 1); draw(); input.focus(); };
      root.insertBefore(c, input);
    });
    input.placeholder = vals.length ? '' : placeholder;
  }
  function add(raw) {
    String(raw).split(',').map(norm).filter(Boolean).forEach(v => {
      if (limitTo && !limitTo.some(([n]) => n === v)) return;
      if (!vals.some(x => x.toLowerCase() === v.toLowerCase())) vals.push(v);
    });
    input.value = ''; draw(); hide();
  }
  function show() {
    const t = input.value.trim().toLowerCase();
    const have = new Set(vals.map(v => v.toLowerCase()));
    opts = pool().filter(([n]) => !have.has(n.toLowerCase()) && (!t || n.toLowerCase().includes(t)))
      .sort((a, b) => (b[0].toLowerCase().startsWith(t) - a[0].toLowerCase().startsWith(t)) || b[1] - a[1] || a[0].localeCompare(b[0]))
      .slice(0, 8);
    hl = -1;
    if (!opts.length) return hide();
    sug.innerHTML = opts.map(([n, c], i) => `<div data-i="${i}"><span>${esc(n)}</span><small>${c}</small></div>`).join('');
    sug.classList.add('open');
  }
  function hide() { sug.classList.remove('open'); hl = -1; }
  function move(d) {
    if (!opts.length) return;
    hl = (hl + d + opts.length) % opts.length;
    $$('div', sug).forEach((el, i) => el.classList.toggle('hl', i === hl));
    $$('div', sug)[hl]?.scrollIntoView({ block: 'nearest' });
  }
  input.addEventListener('input', () => { if (input.value.includes(',')) add(input.value); else show(); });
  input.addEventListener('focus', show);
  input.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== input) { if (input.value.trim()) add(input.value); hide(); } }, 150));
  input.addEventListener('keydown', e => {
    const open = sug.classList.contains('open');
    if (e.key === 'Enter') { e.preventDefault(); if (open && hl >= 0) add(opts[hl][0]); else if (input.value.trim()) add(input.value); }
    else if (e.key === 'Tab' && open && input.value.trim()) { e.preventDefault(); add(opts[Math.max(hl, 0)][0]); }
    else if (e.key === 'Backspace' && !input.value && vals.length) { vals.pop(); draw(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); if (!open) show(); else move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Escape' && open) { e.stopPropagation(); hide(); }
  });
  sug.addEventListener('mousedown', e => { e.preventDefault(); const d = e.target.closest('[data-i]'); if (d) { add(opts[+d.dataset.i][0]); input.focus(); } });
  root.addEventListener('mousedown', e => { if (e.target === root) { e.preventDefault(); input.focus(); } });
  root.append(input, sug); draw();
  return { el: root, input, get: () => { if (input.value.trim()) add(input.value); return [...vals]; } };
}

/* ================= global events ================= */
function bindGlobal() {
  $('#searchForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#q').value.trim(); $('#q').blur();
    navigate(v ? '#/search?q=' + encodeURIComponent(v) : '#/');
  });
  $('#uploadBtn').onclick = () => pickFiles($('#filePick'));
  $('#searchTg').onclick = () => {
    const open = !document.body.classList.contains('search-open');
    setSearchOpen(open);
    if (open) { const qi = $('#q'); qi.focus(); qi.select?.(); }
  };
  // Closing the keyboard on an empty search folds the bar away again (on phones).
  $('#q').addEventListener('blur', () => setTimeout(() => {
    if (!$('#q').value.trim() && parseHash().parts[0] !== 'search' && document.activeElement !== $('#q')) setSearchOpen(false);
  }, 200));
  // Typing in a text box (search, tags…) hides the floating tab bar on phones, see body.typing.
  const isTextBox = el => !!el && (el.tagName === 'TEXTAREA' || el.isContentEditable ||
    (el.tagName === 'INPUT' && !/^(checkbox|radio|range|color|file|button|submit)$/.test(el.type)));
  document.addEventListener('focusin', e => { if (isTextBox(e.target)) document.body.classList.add('typing'); });
  document.addEventListener('focusout', () => setTimeout(() => document.body.classList.toggle('typing', isTextBox(document.activeElement)), 0));
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-tg]'); if (!t) return;
    const head = t.closest('.page-head'), open = !head.classList.contains('open');
    head.classList.toggle('open', open); t.setAttribute('aria-expanded', String(open));
  });
  $('#settingsBtn').onclick = openSettings;
  $('#tbUpload').onclick = () => { if (S.key) pickFiles($('#filePick')); };
  $('#randomBtn').onclick = goRandom;
  $('#modeBtn').onclick = modeTap;
  drawModeBtn();
  $('.tabbar').addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    if ((location.hash || '#/') === a.getAttribute('href')) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });
  for (const inp of [$('#filePick'), $('#importPick')]) inp.addEventListener('cancel', () => { S.picking = false; });
  $('#filePick').onchange = e => { S.picking = false; const f = [...e.target.files]; e.target.value = ''; if (f.length && S.key) startUpload(f); };
  $('#importPick').onchange = e => { S.picking = false; const f = e.target.files[0]; e.target.value = ''; if (f && S.key) importLibrary(f); };
  $('#cbzPick').onchange = e => {
    S.picking = false; const f = [...e.target.files]; e.target.value = ''; if (!f.length || !S.key) return;
    const arcs = f.filter(x => isArchive(x) || isOtherArchive(x)), jsons = f.filter(x => /\.json$/i.test(x.name));
    if (!arcs.length) return toast('Pick CBZ or ZIP files (and Kotatsu’s index.json if there is one)', 4500);
    startArchiveImport(arcs, jsons, f.length - arcs.length - jsons.length);
  };
  $('#bulk').addEventListener('click', e => { const b = e.target.closest('[data-bulk]'); if (b && !b.disabled) bulk(b.dataset.bulk); });

  document.addEventListener('click', e => {
    const fav = e.target.closest('[data-fav]');
    if (fav) { e.preventDefault(); e.stopPropagation(); toggleFav([fav.dataset.fav]); return; }
    const wl = e.target.closest('a[data-web]');
    if (wl && bwHasNative() && siteOfUrl(wl.href) && siteOkHere(siteOfUrl(wl.href))) { e.preventDefault(); openBrowser(siteOfUrl(wl.href), { url: wl.href }); return; }
    const card = e.target.closest('.card[data-id]');
    // The tap that ends a press-and-hold preview shouldn't open the video.
    if (card && (Date.now() - S.lastCtx < 700 || PVT.eat === card)) { PVT.eat = null; e.preventDefault(); return; }
    if (card && S.selecting) { e.preventDefault(); toggleSel(card.dataset.id, card); return; }
    if (card && S.settings.feed !== false && openFeed(card.dataset.id)) { e.preventDefault(); return; }
    if (card && S.settings.photoList !== false && openPhotoList(card.dataset.id)) { e.preventDefault(); return; }
    if (card?.dataset.read) { const p = S.byId.get(card.dataset.read); if (p) { e.preventDefault(); openReader(p, p.readPage || 0); } }
  });
  // Long-press (or right-click) a card to start selecting.
  document.addEventListener('contextmenu', e => {
    const card = e.target.closest('.card[data-id]');
    if (!card || !S.key || !LIST_VIEWS.has(parseHash().parts[0] || '')) return;
    if (PVT.touch && previewable(card)) { e.preventDefault(); return; }
    e.preventDefault(); S.lastCtx = Date.now();
    if (!S.selecting) setSelecting(true);
    toggleSel(card.dataset.id, card);
  });

  document.addEventListener('keydown', e => {
    const top = $$('.overlay').pop();
    if (top) { if (e.key === 'Escape' && !top.dataset.busy) top._close(); return; }
    if (!S.key) return;
    if (RD.open) {
      if (e.key === 'Escape') { e.preventDefault(); closeReader(); return; }
      if (document.activeElement?.classList.contains('rd-slider') || document.activeElement?.tagName === 'VIDEO') return;
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); RD.pager.turn(1); }
      else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); RD.pager.turn(-1); }
      else if (e.key === 'f') rdFav();
      return;
    }
    if (FEED.open) { feedKey(e); return; }
    if (LB.open) {
      const onVideo = document.activeElement?.tagName === 'VIDEO';
      if (e.key === 'Escape') { e.preventDefault(); closeViewer(); }
      else if (e.key === 'ArrowRight' && !onVideo) LB.pager.turn(1);
      else if (e.key === 'ArrowLeft' && !onVideo) LB.pager.turn(-1);
      else if (e.key === 'f') lbFav(false);
      else if (e.key === 'j' || e.key === 'l') { const v = $('#lb .lb-stage video'); if (v) skip(v, e.key === 'j' ? -10 : 10, v.parentElement); }
      else if (e.key === ' ' && !onVideo) { e.preventDefault(); lbTogglePlay(); }
      return;
    }
    if (PL.open) { plKey(e); return; }
    const a = document.activeElement;
    if (a && (/^(INPUT|TEXTAREA|SELECT|VIDEO)$/.test(a.tagName) || a.isContentEditable)) { if (e.key === 'Escape' && a.tagName !== 'VIDEO') a.blur(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); $('#q').focus(); return; }
    if (e.key === 'Escape' && S.selecting) { setSelecting(false); return; }
    if (parseHash().parts[0] !== 'item') return;
    if (e.key === 'j' || e.key === 'l') { const v = $('.viewer video'); if (v) { skip(v, e.key === 'j' ? -10 : 10, $('#viewer')); return; } }
    if (e.key === 'ArrowLeft') $('.arrow.prev')?.click();
    else if (e.key === 'ArrowRight') $('.arrow.next')?.click();
    else if (e.key === 'f') $('[data-act="fav"]')?.click();
    else if (e.key === 'e') $('[data-act="edit"]')?.click();
  });

  let depth = 0;
  const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
  window.addEventListener('dragenter', e => { if (!hasFiles(e) || !S.key) return; e.preventDefault(); depth++; $('#drop').classList.add('on'); });
  window.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = S.key ? 'copy' : 'none'; });
  window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) $('#drop').classList.remove('on'); });
  window.addEventListener('drop', e => {
    if (!hasFiles(e)) return; e.preventDefault(); depth = 0; $('#drop').classList.remove('on');
    if ($('.overlay') || !S.key) return;
    const files = [...e.dataTransfer.files];
    if (files.length && files.every(f => /\.stash$/i.test(f.name))) importLibrary(files[0]);
    else if (files.length) startUpload(files);
  });
  window.addEventListener('hashchange', () => render());
  const toTop = $('#toTop'); toTop.innerHTML = I.up;
  toTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  window.addEventListener('scroll', () => document.body.classList.toggle('show-top', window.scrollY > 1400 && !!S.key), { passive: true });
  // Phones: the top bar slides away while scrolling down and comes back as soon as you scroll up.
  let barY = window.scrollY;
  window.addEventListener('scroll', () => {
    const y = window.scrollY, b = document.body;
    if (Math.abs(y - barY) < BAR_SCROLL_STEP) return;
    const keep = b.classList.contains('search-open') || b.classList.contains('bw-open') || !!$('.overlay');
    b.classList.toggle('bar-hide', y > barY && y > BAR_HIDE_AFTER && !keep);
    barY = y;
  }, { passive: true });
  bindViewer();
  bindFeed();
  bindPhotoList();
  bindReader();
  bindPreviews();
  bindAutoPreviews();
  bindSearchSuggest();
  bindBrowser();
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installPrompt = e; });
  window.addEventListener('appinstalled', () => { S.installPrompt = null; toast('Stash is installed. Open it from your home screen.', 4000); });

  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.picking) setTimeout(() => { S.picking = false; }, 1500); });
}

function showFatal(title, text) {
  document.body.classList.add('locked');
  $('#lock').innerHTML = `<div class="lockbox">${lockLogo()}<h2>${esc(title)}</h2><p>${esc(text)}</p></div>`;
}

async function init() {
  applySettings();
  bindGlobal();
  bindNative();
  if (!NATIVE && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  if (!window.crypto?.subtle || !window.indexedDB) {
    return showFatal('Open this page from its web address', 'Storage only works when this page is opened from an https:// address, or as a file in a desktop browser. On Android, put it online first (for example with GitHub Pages) and open that link in Chrome.');
  }
  try {
    db = await openDB();
    S.vault = (await dbGet('kv', 'vault')) || null;
  } catch (e) {
    console.error(e);
    return showFatal('Storage isn’t available', `This browser blocked storage for this page (${e?.message || e}). Use Chrome, Edge or Firefox outside a private window, and close any other tab that has it open.`);
  }
  try {
    if (!S.vault) await startFresh();
    else if (S.vault.raw) { S.key = await importDEK(S.vault.raw); await loadLibrary(); }
    else return showPasswordRemoval();
  } catch (e) {
    console.error(e);
    return showFatal('Couldn’t open your library', String(e?.message || e));
  }
  unlockUI();
  receiveShared();
}
init();
})();
